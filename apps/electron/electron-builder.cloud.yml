appId: ai.lody.desktop
productName: Lody
extraMetadata:
  desktopName: ai.lody.desktop.desktop
protocols:
  - name: Lody Desktop
    schemes:
      - lody
directories:
  buildResources: build
# Embedded-CLI native deps: swap Electron-ABI bindings per packaging target,
# then boot the packed CLI as a regression smoke.
beforePack: ./scripts/eb-before-pack.mjs
afterPack: ./scripts/eb-after-pack.mjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/node_modules/electron-sparkle-updater/native/vendor/**'
  - '!**/node_modules/electron-sparkle-updater/native/sparkle-chain.tar.xz'
  - '!**/*.map'
  - '!**/*.{md,markdown,mkd}'
  - '!**/{test,tests,__tests__,testing,__mocks__,mocks,spec,examples,example,stories,storybook}/**'
  # better-auth client usage in Electron does not require Prisma runtime.
  - '!node_modules/@prisma/**'
  - '!node_modules/prisma/**'
  - '!node_modules/@better-auth/prisma-adapter/**'
  # Exclude better-auth server/database adapters and transitive DB stacks in desktop client builds.
  - '!node_modules/@better-auth/drizzle-adapter/**'
  - '!node_modules/@better-auth/mongo-adapter/**'
  - '!node_modules/drizzle-orm/**'
  # Exclude transitive runtime-unneeded utility/tooling libs.
  - '!node_modules/effect/**'
  - '!node_modules/prettier/**'
  - '!node_modules/oxfmt/**'
  - '!node_modules/@cloudflare/workers-types/**'
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'
  - '!node_modules/@electric-sql/pglite/**'
  - '!node_modules/@electric-sql/pglite-tools/**'
  - '!node_modules/@electric-sql/pglite-socket/**'
  - '!node_modules/@mrleebo/prisma-ast/**'
  - '!node_modules/mongodb/**'
  - '!node_modules/mysql2/**'
  - '!node_modules/postgres/**'
  - '!node_modules/typescript/**'
  # Keep runtime-required better-auth adapter entrypoints; trim only non-runtime test utilities.
  - '!node_modules/better-auth/dist/test-utils/**'
asarUnpack:
  - resources/**
  # Main E2EE storage loads prebuilds relative to the installed JS package.
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/electron-sparkle-updater/native/build/Release/*.node'
# Keep only the app locales we actually ship to reduce Chromium locale payload.
# Both naming forms are required: macOS resources use the underscore form
# (`en_US`) while Windows/Linux Chromium `locales/*.pak` use the hyphen form
# (`en-US.pak`). Dropping `en-US` leaves the Windows package with NO locale
# `.pak`, which fatally crashes the renderer (exit -36861) the first time it
# renders localized UI such as an `<input type=file>` button (Electron #45251).
# The afterPack hook (`scripts/eb-after-pack.mjs`) asserts a Windows .pak exists.
electronLanguages:
  - en_US
  - en-US
win:
  executableName: lody
  icon: build/icon.ico
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  # Nested binaries need one more exception than the top-level app: the embedded
  # CLI and ACP agents run as Lody Helper and load runtime-installed native
  # addons, which library validation rejects. See the inherit plist's comment.
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraFiles:
    - from: node_modules/electron-sparkle-updater/native/vendor/Sparkle.framework
      to: Frameworks/Sparkle.framework
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSCameraUsageDescription: Lody uses the camera only when you scan another member's ledger verification QR code.
    NSUserNotificationAlertStyle: banner
    # package-electron.mjs must replace this fail-closed value from the selected environment.
    SUFeedURL: https://invalid.invalid/appcast.xml
    SUPublicEDKey: SPARKLE_ED_PUBLIC_KEY_PLACEHOLDER
    SUEnableInstallerLauncherService: false
    SUScheduledCheckInterval: 3600
    CFBundleLocalizations:
      - en
      - zh_CN
  notarize: true
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  writeUpdateInfo: false
linux:
  icon: build/icon.png
  executableName: lodyDesktop
  syncDesktopName: true
  target:
    - AppImage
    - snap
    - deb
  maintainer: lody.ai
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
snap:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
includePdb: false
npmRebuild: false
publish:
  provider: generic
  # package-electron.mjs replaces this fail-closed URL with the selected
  # staging/production feed. Direct electron-builder calls must never silently
  # produce a cloud package that updates from production.
  url: https://invalid.invalid/electron-updates
