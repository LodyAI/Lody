appId: dev.loro.lody.oss
productName: Lody OSS
protocols:
  - name: Lody OSS Desktop
    schemes:
      - lody-oss
directories:
  buildResources: build
# Embedded-CLI native deps: swap Electron-ABI bindings per packaging target,
# then boot the packed CLI as a regression smoke.
beforePack: ./scripts/eb-before-pack.mjs
afterPack: ./scripts/eb-after-pack.mjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.{md,markdown,mkd}'
  - '!**/{test,tests,__tests__,testing,__mocks__,mocks,spec,examples,example,stories,storybook}/**'
  # better-auth client usage in Electron does not require Prisma runtime.
  - '!node_modules/@prisma/**'
  - '!node_modules/prisma/**'
  - '!node_modules/@better-auth/prisma-adapter/**'
  # Exclude better-auth server/database adapters and transitive DB stacks in desktop client builds.
  - '!node_modules/@better-auth/drizzle-adapter/**'
  - '!node_modules/@better-auth/mongo-adapter/**'
  - '!node_modules/drizzle-orm/**'
  # Exclude transitive runtime-unneeded utility/tooling libs.
  - '!node_modules/effect/**'
  - '!node_modules/@cloudflare/workers-types/**'
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'
  - '!node_modules/@electric-sql/pglite/**'
  - '!node_modules/@electric-sql/pglite-tools/**'
  - '!node_modules/@electric-sql/pglite-socket/**'
  - '!node_modules/@mrleebo/prisma-ast/**'
  - '!node_modules/mongodb/**'
  - '!node_modules/mysql2/**'
  - '!node_modules/postgres/**'
  - '!node_modules/typescript/**'
  # Keep runtime-required better-auth adapter entrypoints; trim only non-runtime test utilities.
  - '!node_modules/better-auth/dist/test-utils/**'
asarUnpack:
  - resources/**
# Keep only the app locales we actually ship to reduce Chromium locale payload.
# Both naming forms are required: macOS resources use the underscore form
# (`en_US`) while Windows/Linux Chromium `locales/*.pak` use the hyphen form
# (`en-US.pak`). Dropping `en-US` leaves the Windows package with NO locale
# `.pak`, which fatally crashes the renderer (exit -36861) the first time it
# renders localized UI such as an `<input type=file>` button (Electron #45251).
# The afterPack hook (`scripts/eb-after-pack.mjs`) asserts a Windows .pak exists.
electronLanguages:
  - en_US
  - en-US
win:
  executableName: lody-oss
  icon: build/icon.ico
nsis:
  # GitHub Releases rewrites spaces in uploaded asset names to periods, which would
  # desynchronize the file names electron-builder records in latest*.yml from the
  # ones electron-updater can actually download. productName is "Lody OSS", so every
  # artifact name here uses a space-free token instead of ${productName}.
  artifactName: LodyOSS-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSUserNotificationAlertStyle: banner
  # Squirrel.Mac refuses to install an update whose code signature it cannot
  # validate against the running app, so signed + notarized is what makes macOS
  # auto-update work at all. Local builds without Apple credentials are still
  # fine: electron-builder skips signing (and therefore notarization) with a
  # warning rather than failing.
  notarize: true
  # Covers the zip target that Squirrel.Mac downloads for auto-update.
  artifactName: LodyOSS-${version}-${arch}.${ext}
dmg:
  artifactName: LodyOSS-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  executableName: lodyOssDesktop
  syncDesktopName: true
  target:
    - AppImage
    - snap
    - deb
  maintainer: LodyAI
  category: Utility
appImage:
  artifactName: LodyOSS-${version}-${arch}.${ext}
snap:
  artifactName: LodyOSS-${version}-${arch}.${ext}
deb:
  artifactName: LodyOSS-${version}-${arch}.${ext}
includePdb: false
npmRebuild: false
# The public build has no VITE_ELECTRON_UPDATE_URL to inject: electron.vite.config.ts
# deliberately strips every VITE_* value so public builds stay deterministic. This
# provider is baked into the packaged app-update.yml instead, which is exactly the
# fallback AppUpdaterService takes when no feed URL is defined. Generating latest*.yml
# during packaging also depends on this block being present.
publish:
  provider: github
  owner: loro-dev
  repo: lody-oss
