import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Optional iroh transport: built by `pnpm --filter @lody/iroh-native build:android`.
// Without those outputs the app builds unchanged and the WebView keeps Streams RPC.
def irohAndroid = file('../../../../packages/iroh-native/mobile-dist/android')
def hasIroh = file("${irohAndroid}/kotlin").isDirectory() && file("${irohAndroid}/jniLibs").isDirectory()
if (hasIroh) {
    apply plugin: 'org.jetbrains.kotlin.android'
}

def mobileVersionName = {
    def propertyValue = project.findProperty('mobileVersionName')
    if (propertyValue) {
        return propertyValue.toString()
    }

    def envValue = System.getenv('MOBILE_VERSION_NAME')
    if (envValue) {
        return envValue
    }

    def packageJson = new JsonSlurper().parse(file('../../package.json'))
    return packageJson.version.toString()
}()

def versionNameToCode = { versionName ->
    def matcher = (versionName =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (!matcher.find()) {
        return 1
    }
    return matcher.group(1).toInteger() * 1000000 +
            matcher.group(2).toInteger() * 1000 +
            matcher.group(3).toInteger()
}

def mobileVersionCode = {
    def rawValue = project.findProperty('mobileVersionCode') ?:
            System.getenv('MOBILE_VERSION_CODE') ?:
            System.getenv('GITHUB_RUN_NUMBER')
    if (rawValue) {
        return rawValue.toString().toInteger()
    }
    return versionNameToCode(mobileVersionName)
}()

def androidKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def androidKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def androidKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def androidKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasAndroidSigning = androidKeystorePath && androidKeystorePassword && androidKeyAlias && androidKeyPassword

android {
    namespace = "ai.lody.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.lody.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobileVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasAndroidSigning) {
            release {
                storeFile file(androidKeystorePath)
                storePassword androidKeystorePassword
                keyAlias androidKeyAlias
                keyPassword androidKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasAndroidSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (hasIroh) {
        sourceSets.main {
            java.srcDirs += ['src/iroh/kotlin', "${irohAndroid}/kotlin"]
            jniLibs.srcDirs += ["${irohAndroid}/jniLibs"]
        }
        kotlinOptions { jvmTarget = '21' }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "lody-${variant.buildType.name}-v${variant.versionName}+${variant.versionCode}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    if (hasIroh) {
        implementation 'net.java.dev.jna:jna:5.17.0@aar'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Native push requires Firebase client configuration.")
}
