  '@better-auth/api-key': 1.5.5
  '@better-auth/core': 1.5.5
  '@better-auth/electron': 1.5.5
  '@convex-dev/better-auth': 0.11.2
  '@devframes/agentic': 1.0.0
  '@devframes/hub': 1.0.0
  '@devframes/hub-ui': 1.0.0
  '@devframes/json-render': 1.0.0
  '@devframes/json-render-ui': 1.0.0
  '@devframes/plugin-a11y': 1.0.0
  '@devframes/plugin-a11y--assets': 1.0.0
