  '@peculiar/x509>@peculiar/asn1-schema': 2.10.0
  acp-extension-core: workspace:*
  electron-builder-squirrel-windows: ^26.15.3
  '@loro-dev/loro-cli>loro-crdt': 1.16.3
  tsx@4.21.0>esbuild: 0.27.0
  vite@7.3.1>esbuild: 0.27.0
  # Keep a single zod major graph so better-auth/better-call peer types do not
  # fork (TanStack router-generator otherwise pulls 4.4.x next to catalog 4.3.x).
