packages:
  - packages/*
  # Full upstream-derived runtime workspace; built and validated independently.
  - '!packages/acp-extension-kimi'
  - apps/cli
  - apps/electron
  - e2e
  - site-docs

catalog:
  '@agentclientprotocol/sdk': ^1.3.0
  '@better-auth/api-key': 1.5.5
  '@better-auth/core': 1.5.5
  '@better-auth/electron': 1.5.5
  '@convex-dev/better-auth': 0.11.2
  '@loro-dev/flock-wasm': ^0.4.3
  '@loro-dev/loro-cli': 0.6.0
  '@loro-dev/sqlite-riverrun': 0.2.0
  '@loro-dev/streams-client': 0.7.0
  '@loro-dev/streams-crdt': 0.15.1
  '@tanstack/react-router': ^1.127.9
  '@tanstack/react-router-devtools': ^1.127.9
  '@tanstack/router-plugin': ^1.127.9
  '@tanstack/router-vite-plugin': ^1.127.9
  '@types/better-sqlite3': ^7.6.13
  '@types/node': ^24.10.1
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@vitejs/plugin-react': ^4.6.0
  better-auth: 1.5.5
  better-auth-capacitor: 0.3.6
  # >=13.0.2 ships prebuilt N-API binaries and has no install script. Keep this
  # lower bound so `npx lody` also works when package install scripts are disabled.
  better-sqlite3: ^13.0.2
  convex: ^1.33.1
  effect: 3.18.4
  jotai: ^2.16.0
  loro-adaptors: ^0.6.1
  loro-crdt: ^1.15.1
  loro-mirror: 2.3.1
  loro-mirror-jotai: 2.3.1
  loro-mirror-react: 2.3.1
  loro-protocol: ^0.3.0
  loro-repo: ^0.20.0
  loro-websocket: ^0.6.2
  lucide-react: ^0.523.0
  react: 19.2.0
  react-dom: 19.2.0
  typescript: ^5.9.3
  undici: ^6.26.0
  vite: ^6.0.0
  vite-plugin-top-level-await: ^1.6.0
  vite-plugin-wasm: ^3.5.0
  zod: ^4.1.5

ignoredBuiltDependencies:
  - node-pty
  # >=13.0.2 has no install script; pnpm still offers to build it because the
  # package retains binding.gyp for explicit source builds.
  - better-sqlite3

managePackageManagerVersions: true

onlyBuiltDependencies:
  - '@moonshot-ai/kimi-code'
  - '@posthog/cli'
  - '@prisma/engines'
  - '@swc/core'
  - core-js
  - cpu-features
  - electron
  - electron-winstaller
  - esbuild
  - prisma
  - protobufjs
  - sharp
  - ssh2
  - workerd

overrides:
  acp-extension-core: workspace:*
  electron-builder-squirrel-windows: ^26.15.3
  tsx@4.21.0>esbuild: 0.27.0
  vite@7.3.1>esbuild: 0.27.0
  # Keep a single zod major graph so better-auth/better-call peer types do not
  # fork (TanStack router-generator otherwise pulls 4.4.x next to catalog 4.3.x).
  zod: 4.3.6

packageExtensions:
  konsta@4.0.1:
    peerDependencies:
      react: '*'

packageManagerStrictVersion: true

patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  '@better-auth/api-key@1.5.5': patches/@better-auth__api-key@1.5.5.patch
  '@better-auth/electron@1.5.5': patches/@better-auth__electron@1.5.5.patch
  '@pierre/diffs@1.0.10': patches/@pierre__diffs@1.0.10.patch
  '@tanstack/router-generator@1.159.4': patches/@tanstack__router-generator@1.159.4.patch
  loro-repo@0.20.0: patches/loro-repo.patch
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch
  react-photo-view@1.2.7: patches/react-photo-view@1.2.7.patch
  remend@1.3.0: patches/remend@1.3.0.patch
