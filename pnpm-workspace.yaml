  '@tanstack/react-router-devtools': ^1.127.9
  '@tanstack/router-plugin': ^1.127.9
  '@tanstack/router-vite-plugin': ^1.127.9
  '@types/better-sqlite3': ^7.6.13
  '@types/node': ^24.10.1
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  '@vitejs/plugin-react': ^5.2.0
  better-auth: 1.5.5
  better-auth-capacitor: 0.3.6
  # >=13.0.2 ships prebuilt N-API binaries and has no install script. Keep this
  # lower bound so `npx lody` also works when package install scripts are disabled.
  better-sqlite3: ^13.0.2
  convex: ^1.33.1
  devframe: 1.0.0
  effect: 3.18.4
  jotai: ^2.16.0
  loro-adaptors: ^0.6.1
  loro-crdt: ^1.15.1
  loro-mirror: 2.3.2
  loro-mirror-jotai: 2.3.2
  loro-mirror-react: 2.3.2
  loro-protocol: ^0.3.0
  loro-repo: ^0.20.0
  loro-websocket: ^0.6.2
  lucide-react: ^0.523.0
  react: 19.2.0
  react-dom: 19.2.0
  typescript: ^5.9.3
  undici: ^6.26.0
  vite: ^8.2.2
  vite-plugin-top-level-await: ^1.6.0
  vite-plugin-wasm: ^3.6.0
  zod: ^4.1.5

ignoredBuiltDependencies:
  - node-pty
  # >=13.0.2 has no install script; pnpm still offers to build it because the
  # package retains binding.gyp for explicit source builds.
  - better-sqlite3

managePackageManagerVersions: true

# Delay newly published package versions for seven days before pnpm may resolve them.
minimumReleaseAge: 10080

# Grandfather versions already locked on main; later releases remain quarantined.
minimumReleaseAgeExclude:
  # Built-in runtime refresh, verified together with the pinned adapters.
  - '@anthropic-ai/claude-agent-sdk@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280'
