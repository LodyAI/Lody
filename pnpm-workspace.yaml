  - '@devframes/hub@1.0.0'
  - '@devframes/json-render-ui@1.0.0'
  - '@devframes/json-render@1.0.0'
  - '@devframes/plugin-a11y--assets@1.0.0'
  - '@devframes/plugin-a11y@1.0.0'
  - '@devframes/plugin-inspect--assets@1.0.0'
  - '@devframes/plugin-inspect@1.0.0'
  - '@devframes/plugin-terminals--assets@1.0.0'
