<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E2EE demo (local only)</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 1.5rem;
        max-width: 52rem;
      }
      label,
      button,
      input,
      select {
        display: block;
        margin: 0.4rem 0;
      }
      output,
      pre {
        white-space: pre-wrap;
        background: #f4f4f4;
        padding: 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>Independent E2EE demo</h1>
    <p>
      Local-only. The account picker is not a product login. Device keys, signatures, invite
      approval and authorization are real. Isolated browser contexts must not share keys.
    </p>
    <label
      >Account
      <select id="account">
        <option>alice</option>
        <option>bob</option>
        <option>carol</option>
      </select>
    </label>
    <button id="health">Check host</button>
    <output id="status">disconnected</output>
    <pre id="log"></pre>
    <script>
      const status = document.getElementById('status');
      const log = document.getElementById('log');
      document.getElementById('health').onclick = async () => {
        const ready = await fetch('/readyz');
        const body = await ready.json();
        status.textContent = ready.ok ? 'connected' : 'failed';
        log.textContent = JSON.stringify(body, null, 2);
      };
    </script>
  </body>
</html>
