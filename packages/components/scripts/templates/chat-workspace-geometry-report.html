<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lody 几何对齐报告</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#fafafa, #0a0a0a);
        --surface: light-dark(#ffffff, #141414);
        --border: light-dark(rgba(0, 0, 0, 0.09), rgba(255, 255, 255, 0.09));
        --border-strong: light-dark(rgba(0, 0, 0, 0.16), rgba(255, 255, 255, 0.18));
        --text: light-dark(#171717, #ededed);
        --text-muted: light-dark(#737373, #8f8f8f);
        --text-faint: light-dark(#a3a3a3, #5c5c5c);
        --hover: light-dark(rgba(0, 0, 0, 0.04), rgba(255, 255, 255, 0.05));
        --fail: light-dark(#dc2626, #f87171);
        --fail-soft: light-dark(rgba(220, 38, 38, 0.08), rgba(248, 113, 113, 0.12));
        --candidate: light-dark(#b45309, #fbbf24);
        --candidate-soft: light-dark(rgba(180, 83, 9, 0.08), rgba(251, 191, 36, 0.1));
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          'Helvetica Neue',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-feature-settings: 'tnum';
      }

      .report {
        width: min(1240px, 100%);
        margin-inline: auto;
        padding: 56px 32px 96px;
      }

      /* ---------- header ---------- */

      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-faint);
      }

      h1 {
        margin: 10px 0 0;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .meta {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }

      .meta .mono {
        font-size: 12px;
      }

      .coverage {
        margin-top: 28px;
        border-block: 1px solid var(--border);
        padding-block: 14px;
      }

      .coverage summary {
        cursor: pointer;
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 550;
      }

      .coverage-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
        padding-top: 16px;
      }

      .coverage-grid h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 650;
        color: var(--text);
      }

      .coverage-grid ul {
        margin: 0;
        padding-left: 18px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.65;
      }

      .coverage-grid code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--text);
      }

      /* ---------- summary / filter ---------- */

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin-top: 28px;
        padding-block: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .chip {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        border-radius: 999px;
        padding: 5px 12px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition:
          color 120ms ease,
          border-color 120ms ease,
          background-color 120ms ease;
      }

      .chip:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }

      .chip[aria-pressed='true'] {
        color: var(--text);
        background: var(--surface);
        border-color: var(--border-strong);
      }

      .chip .count {
        font-size: 11.5px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .dot--fail {
        color: var(--fail);
      }

      .dot--candidate {
        color: var(--candidate);
      }

      .dot--insufficient {
        color: var(--text-faint);
      }

      .toolbar-end {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-faint);
      }

      /* ---------- detail list ---------- */

      .detail-reviews {
        border-top: 1px solid var(--border);
      }

      .detail-section-heading {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 22px 4px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .detail-section-heading[hidden] {
        display: none;
      }

      .detail-section-heading .count {
        font-weight: 500;
        color: var(--text-faint);
      }

      .status-badge {
        display: inline-block;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 1px 8px;
        margin-right: 8px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .detail-facts {
        margin: 0 0 14px;
        padding: 0 4px 0 52px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .detail-repair {
        margin: 0 0 14px;
        padding: 0 4px 0 52px;
        font-size: 12.5px;
        color: var(--text);
        text-wrap: pretty;
      }

      .detail-review {
        border-bottom: 1px solid var(--border);
      }

      .detail-review[hidden] {
        display: none;
      }

      .detail-toggle {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        width: 100%;
        padding: 18px 4px;
        cursor: pointer;
        display: grid;
        grid-template-columns: 28px 10px minmax(0, 1fr) auto 20px;
        align-items: baseline;
        gap: 14px;
        border-radius: 4px;
        transition: background-color 120ms ease;
      }

      .detail-toggle:hover {
        background: var(--hover);
      }

      .detail-index {
        font-size: 12px;
        color: var(--text-faint);
      }

      .detail-toggle .dot {
        align-self: center;
      }

      .detail-title {
        font-size: 14.5px;
        font-weight: 550;
        letter-spacing: -0.01em;
      }

      .detail-description {
        margin-top: 3px;
        font-size: 12.5px;
        color: var(--text-muted);
        text-wrap: pretty;
      }

      .detail-finding {
        font-size: 12px;
        line-height: 1.5;
        padding: 4px 10px;
        border-radius: 6px;
        max-width: 46ch;
        text-align: left;
      }

      .detail-review[data-kind='violation'] .detail-finding {
        color: var(--fail);
        background: var(--fail-soft);
      }

      .detail-review[data-kind='candidate'] .detail-finding {
        color: var(--candidate);
        background: var(--candidate-soft);
      }

      .detail-review[data-kind='jitter'] .detail-finding {
        color: var(--candidate);
        background: var(--candidate-soft);
      }

      .detail-review[data-kind='cross-family-candidate'] .detail-finding {
        color: var(--text-muted);
        background: var(--hover);
      }

      .detail-review[data-kind='insufficient'] .detail-finding {
        color: var(--text-muted);
        background: var(--hover);
      }

      .detail-review[data-kind='overview'] .detail-finding {
        color: var(--text-muted);
        background: var(--hover);
      }

      .chevron {
        align-self: center;
        width: 14px;
        height: 14px;
        color: var(--text-faint);
        transition: transform 180ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .detail-toggle[aria-expanded='true'] .chevron {
        transform: rotate(90deg);
      }

      /* expanding region: grid-rows trick keeps the animation compositor-cheap */

      .detail-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 220ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .detail-review[data-open='true'] .detail-body {
        grid-template-rows: 1fr;
      }

      .detail-body-inner {
        overflow: hidden;
        min-height: 0;
      }

      .detail-pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        padding: 4px 4px 26px 52px;
      }

      .detail-pair.has-after {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      figure {
        margin: 0;
      }

      .figure-frame {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: #ffffff;
        cursor: zoom-in;
        padding: 0;
        display: block;
        width: 100%;
        appearance: none;
      }

      .figure-frame img {
        display: block;
        width: 100%;
        height: auto;
        transition: opacity 160ms ease;
      }

      .figure-frame:hover img {
        opacity: 0.85;
      }

      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 2px 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      figcaption a {
        color: var(--text-faint);
        text-decoration: none;
        white-space: nowrap;
        transition: color 120ms ease;
      }

      figcaption a:hover {
        color: var(--text);
      }

      .visual-candidates {
        margin: 28px 0;
      }
      .visual-candidates details {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .visual-candidates summary {
        cursor: pointer;
      }
      .visual-candidates .evidence {
        color: var(--text-muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .visual-overlay {
        position: relative;
        margin-top: 12px;
      }
      .visual-overlay img {
        display: block;
        width: 100%;
      }
      .visual-overlay svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* ---------- lightbox ---------- */

      dialog.lightbox {
        border: 0;
        padding: 0;
        background: transparent;
        max-width: min(92vw, 1600px);
        max-height: 92vh;
      }

      dialog.lightbox::backdrop {
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(6px);
      }

      dialog.lightbox[open] {
        animation: lightbox-in 160ms cubic-bezier(0.2, 0, 0.2, 1);
      }

      @keyframes lightbox-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }

      .lightbox img {
        display: block;
        max-width: 100%;
        max-height: 84vh;
        border-radius: 8px;
      }

      .lightbox figcaption {
        color: rgba(255, 255, 255, 0.65);
      }

      .lightbox figcaption a {
        color: rgba(255, 255, 255, 0.45);
      }

      .lightbox figcaption a:hover {
        color: #ffffff;
      }

      /* ---------- entrance ---------- */

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }

      .report-header,
      .toolbar {
        animation: rise 360ms cubic-bezier(0.2, 0, 0.2, 1) both;
      }

      .toolbar {
        animation-delay: 60ms;
      }

      @media (max-width: 860px) {
        .report {
          padding: 36px 20px 64px;
        }

        .coverage-grid {
          grid-template-columns: 1fr;
        }

        .detail-toggle {
          grid-template-columns: 10px minmax(0, 1fr) 20px;
        }

        .detail-index,
        .detail-finding {
          grid-column: 2;
        }

        .detail-finding {
          margin-top: 8px;
          justify-self: start;
        }

        .detail-pair {
          grid-template-columns: 1fr;
          padding-left: 4px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="report">
      <header class="report-header">
        <p class="eyebrow">Lody · Geometry Report</p>
        <h1>几何对齐报告</h1>
        <p class="meta" id="meta"></p>
      </header>

      <details class="coverage" id="coverage">
        <summary id="coverage-summary"></summary>
        <div class="coverage-grid">
          <section>
            <h2>已捕获</h2>
            <ul id="coverage-captures"></ul>
          </section>
          <section>
            <h2>明确排除</h2>
            <ul id="coverage-exclusions"></ul>
          </section>
        </div>
      </details>

      <section class="visual-candidates" aria-label="Visual repetition candidates">
        <h2>Visual repetition candidates · 未分诊</h2>
        <p class="meta" id="visual-summary"></p>
        <label
          >Capture
          <select id="visual-capture-filter">
            <option value="">全部</option>
          </select></label
        >
        <label
          >Evidence
          <select id="visual-evidence-filter">
            <option value="review">Review candidates · peer ≥ 2</option>
            <option value="all">All raw deviations</option>
          </select></label
        >
        <a href="visual-repetition.json">完整 discovery JSON</a>
        <p class="meta">
          排序仅供 review；不进入 ledger / gate。红框为候选，绿框为 dominant，橙框为
          peers，绿线为预期坐标；pitch 是间距，仅标记目标。默认合并同一 atom 的重复边界测量；
          完整原始结果见 JSON。
        </p>
        <div id="visual-candidates"></div>
        <button type="button" id="visual-more">显示更多</button>
      </section>

      <h2>Existing rails</h2>
      <div class="toolbar" id="toolbar" role="group" aria-label="按类型筛选"></div>

      <div class="detail-reviews" id="detail-reviews"></div>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="截图预览">
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption>
          <span id="lightbox-caption"></span>
          <a id="lightbox-link" href="#" target="_blank" rel="noreferrer">打开 2× PNG ↗</a>
        </figcaption>
      </figure>
    </dialog>

    <script id="geometry-report-data" type="application/json">
      __GEOMETRY_REPORT_DATA__
    </script>
    <script>
      const report = JSON.parse(document.getElementById('geometry-report-data').textContent);

      const visualCaptures = report.visualRepetition?.captures ?? [];
      const rawVisualCandidates = visualCaptures
        .flatMap((capture) => {
          const atoms = new Map(capture.atoms.map((atom) => [atom.id, atom]));
          return capture.deviations.map((deviation) => ({
            capture,
            deviation,
            atom: atoms.get(deviation.atomId),
            atoms,
          }));
        })
        .sort((a, b) => b.deviation.score - a.deviation.score);
      const rankVisualCandidates = (candidates) =>
        [...candidates]
          .sort((a, b) => b.deviation.score - a.deviation.score)
          .map((candidate, index) => ({ ...candidate, rank: index + 1 }));
      const reviewVisualCandidates = rankVisualCandidates(
        rawVisualCandidates
          .filter(({ deviation }) => deviation.peerSupport >= 2)
          .reduce((unique, candidate) => {
            // Start/end/center are three views of one edge question. Keep pitch
            // separate because it measures spacing along the series axis.
            const { capture, deviation, atom } = candidate;
            const measureFamily = deviation.measure === 'pitch' ? 'pitch' : 'edge';
            const key = `${capture.captureId}\u0000${atom.id}\u0000${deviation.axis}\u0000${measureFamily}`;
            const previous = unique.get(key);
            if (!previous || previous.deviation.score < deviation.score) unique.set(key, candidate);
            return unique;
          }, new Map())
          .values()
      );
      const visualCandidates = rankVisualCandidates(rawVisualCandidates);
      document.getElementById('visual-summary').textContent =
        `${visualCaptures.length} captures · ${visualCaptures.reduce((sum, capture) => sum + capture.atoms.length, 0)} atoms · ${reviewVisualCandidates.length} review candidates / ${visualCandidates.length} raw deviations · 每个 capture 独立计算，尚未跨 capture 确认`;
      const visualList = document.getElementById('visual-candidates');
      const px = (value) => `${Number(value.toFixed(2))}px`;
      function appendVisualCandidate({ capture, deviation, atom, atoms, rank }) {
        const card = document.createElement('details');
        const heading = document.createElement('summary');
        const signedDelta = deviation.value - deviation.expected;
        heading.textContent = `#${rank} ${atom.label} · ${deviation.axis}-${deviation.measure} · ${signedDelta >= 0 ? '+' : ''}${px(signedDelta)} · ${capture.captureId}`;
        card.append(heading);
        // Materialize images only on expansion; retain every ranked candidate.
        card.addEventListener('toggle', () => {
          if (!card.open || card.dataset.rendered) return;
          card.dataset.rendered = 'true';
          const evidence = document.createElement('p');
          evidence.className = 'evidence';
          evidence.textContent = `expected ${px(deviation.expected)} · actual ${px(deviation.value)} · dominant support ${deviation.dominantSupport} · peer support ${deviation.peerSupport} · series ${deviation.seriesSize} · score ${Number(deviation.score.toFixed(2))} · ${deviation.signature}`;
          const provenance = document.createElement('p');
          provenance.className = 'evidence';
          provenance.textContent = `${capture.captureId} · ${capture.viewport.width}×${capture.viewport.height} · DPR ${capture.deviceScaleFactor} · ${JSON.stringify(capture.dimensions ?? {})} · ${atom.id} · ${atom.scope ?? ''} · ${atom.component ?? ''} · ${atom.className ?? ''}`;
          card.append(evidence, provenance);
          const witnesses = document.createElement('p');
          witnesses.className = 'evidence';
          const labels = (ids) => ids.map((id) => `${atoms.get(id).label} (${id})`).join(' · ');
          witnesses.textContent = `Dominant: ${labels(deviation.dominantAtomIds)} / Peers: ${labels(deviation.peerAtomIds)}`;
          card.append(witnesses);
          if (!capture.screenshot || !capture.screenshotClip) {
            const missing = document.createElement('p');
            missing.className = 'evidence';
            missing.textContent = '此 capture 未保存整体截图；完整测量见 visual-repetition.json。';
            card.append(missing);
            return;
          }
          const clip = capture.screenshotClip;
          const figure = document.createElement('div');
          figure.className = 'visual-overlay';
          const image = document.createElement('img');
          image.src = capture.screenshot;
          image.alt = `${capture.captureId} · ${atom.label}`;
          const ns = 'http://www.w3.org/2000/svg';
          const overlay = document.createElementNS(ns, 'svg');
          overlay.setAttribute('viewBox', `${clip.x} ${clip.y} ${clip.width} ${clip.height}`);
          const addBox = (member, color) => {
            const box = document.createElementNS(ns, 'rect');
            for (const [key, value] of Object.entries({
              x: member.xStart,
              y: member.yStart,
              width: member.xEnd - member.xStart,
              height: member.yEnd - member.yStart,
              fill: 'none',
              stroke: color,
              'stroke-width': 2,
            }))
              box.setAttribute(key, String(value));
            overlay.append(box);
          };
          deviation.dominantAtomIds.forEach((id) => addBox(atoms.get(id), '#10b981'));
          deviation.peerAtomIds.forEach((id) => addBox(atoms.get(id), '#f59e0b'));
          addBox(atom, '#ff4050');
          if (deviation.measure !== 'pitch') {
            const line = document.createElementNS(ns, 'line');
            const points =
              deviation.axis === 'x'
                ? {
                    x1: deviation.expected,
                    x2: deviation.expected,
                    y1: clip.y,
                    y2: clip.y + clip.height,
                  }
                : {
                    y1: deviation.expected,
                    y2: deviation.expected,
                    x1: clip.x,
                    x2: clip.x + clip.width,
                  };
            for (const [key, value] of Object.entries({
              ...points,
              stroke: '#10b981',
              'stroke-width': 1,
              'stroke-dasharray': '4 3',
            }))
              line.setAttribute(key, String(value));
            overlay.append(line);
          }
          figure.append(image, overlay);
          card.append(figure);
        });
        visualList.append(card);
      }
      const captureFilter = document.getElementById('visual-capture-filter');
      const evidenceFilter = document.getElementById('visual-evidence-filter');
      for (const capture of visualCaptures) {
        const option = document.createElement('option');
        option.value = capture.captureId;
        option.textContent = `${capture.captureId} (${capture.deviations.length})`;
        captureFilter.append(option);
      }
      let selectedVisualCandidates = reviewVisualCandidates;
      let visibleVisualCount = 0;
      const visualMore = document.getElementById('visual-more');
      function showMoreVisualCandidates() {
        const next = selectedVisualCandidates.slice(visibleVisualCount, visibleVisualCount + 30);
        next.forEach(appendVisualCandidate);
        visibleVisualCount += next.length;
        visualMore.hidden = visibleVisualCount === selectedVisualCandidates.length;
        visualMore.textContent = `显示更多 (${visibleVisualCount}/${selectedVisualCandidates.length})`;
      }
      visualMore.addEventListener('click', showMoreVisualCandidates);
      const updateVisualCandidates = () => {
        const candidates =
          evidenceFilter.value === 'all' ? visualCandidates : reviewVisualCandidates;
        selectedVisualCandidates = candidates.filter(
          ({ capture }) => !captureFilter.value || capture.captureId === captureFilter.value
        );
        visibleVisualCount = 0;
        visualList.replaceChildren();
        showMoreVisualCandidates();
      };
      captureFilter.addEventListener('change', updateVisualCandidates);
      evidenceFilter.addEventListener('change', updateVisualCandidates);
      showMoreVisualCandidates();

      const chevronSvg =
        '<svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
        '<path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const violations = report.details.filter((d) => d.kind === 'violation');
      const candidates = report.details.filter((d) => d.kind === 'candidate');
      const reviewCandidates = candidates.filter((d) => d.requiresReview);
      const stableCandidates = candidates.filter((d) => !d.requiresReview);
      const overviews = report.details.filter((d) => d.kind === 'overview');
      const crossFamilyCandidates = report.details.filter(
        (d) => d.kind === 'cross-family-candidate'
      );
      const jitters = report.details.filter((d) => d.kind === 'jitter');
      const insufficient = report.details.filter((d) => d.kind === 'insufficient');
      const measurementModels = report.details.filter((d) => d.kind === 'measurement-model');
      const cssDefects = report.details.filter((d) => d.classification === 'css-defect');
      const opticalResiduals = report.details.filter(
        (d) => d.classification === 'optical-residual'
      );
      const structural = report.details.filter((d) => d.classification === 'structural');

      const reportMeta = [
        new Date(report.generatedAt).toLocaleString(),
        `${report.viewport.width} × ${report.viewport.height}`,
        `${report.coverage.captures.length} 个页面捕获`,
        `${report.findingDiff.current.length} 条 finding（全部展示）`,
        `${report.findingDiff.new.length} 个新 finding`,
        `${report.findingDiff.changed.length} 个偏移变化`,
        `${report.findingDiff.resolved.length} 个已消失`,
        report.qualityMetrics.discoveryPrecision == null
          ? 'Discovery precision 待标注'
          : `Discovery precision ${(report.qualityMetrics.discoveryPrecision * 100).toFixed(1)}%（${report.qualityMetrics.labeledFindingCount} 条已标注）`,
        report.qualityMetrics.geometryCoverage == null
          ? 'Geometry coverage 暂无原语'
          : `Geometry coverage ${(report.qualityMetrics.geometryCoverage * 100).toFixed(1)}%`,
        `${cssDefects.length} 个 CSS 缺陷 / ${structural.length} 个结构性 / ${opticalResiduals.length} 个视觉余量`,
        `${report.pixelWitnesses.length} 个像素证人（仅 confidence）`,
        `${report.contractProposals.length} 个 Contract 候选`,
      ];
      if (report.afterCapturedAt) {
        reportMeta.push(`修复后捕获 ${new Date(report.afterCapturedAt).toLocaleString()}`);
      }
      document.getElementById('meta').replaceChildren(
        ...reportMeta.map((text) => {
          const span = document.createElement('span');
          span.className = 'mono';
          span.textContent = text;
          return span;
        })
      );

      const coverageSummary = document.getElementById('coverage-summary');
      coverageSummary.textContent = `扫描范围 · ${report.coverage.scope} · ${report.coverage.captures.length} 个捕获 · ${report.coverage.exclusions.length} 个明确排除`;
      const coverageCaptures = document.getElementById('coverage-captures');
      for (const capture of report.coverage.captures) {
        const item = document.createElement('li');
        const id = document.createElement('code');
        id.textContent = capture.captureId;
        const dimensions = capture.dimensions
          ? ` · ${capture.dimensions.theme}/${capture.dimensions.locale}/${capture.dimensions.density}`
          : '';
        item.append(
          id,
          ` · ${capture.viewport.width}×${capture.viewport.height} · ${capture.surface}${dimensions}`
        );
        coverageCaptures.append(item);
      }
      const coverageExclusions = document.getElementById('coverage-exclusions');
      for (const exclusion of report.coverage.exclusions) {
        const item = document.createElement('li');
        const id = document.createElement('code');
        id.textContent = exclusion.storyId;
        item.append(id, ` · ${exclusion.reason}`);
        coverageExclusions.append(item);
      }

      // ---------- grouping + filter ----------

      const reviewsEl = document.getElementById('detail-reviews');
      const toolbar = document.getElementById('toolbar');

      const STATUS_LABELS = {
        new: '新增',
        changed: '偏移变化',
        debt: '待修复债务',
        'wont-fix': '不修复',
        fixed: '已修复',
        promoted: '已提升为 Contract',
        ignored: '已忽略',
        unreviewed: '未纳入 ledger',
      };
      const STATUS_ORDER = [
        'new',
        'changed',
        'debt',
        'wont-fix',
        'fixed',
        'promoted',
        'ignored',
        'unreviewed',
      ];
      const CLASSIFICATION_ORDER = ['css-defect', 'structural', 'optical-residual', ''];
      const CLASSIFICATION_LABELS = {
        'css-defect': 'CSS 缺陷',
        structural: '结构性',
        'optical-residual': '视觉余量',
      };
      const detailStatus = (detail) => detail.ledgerStatus ?? 'unreviewed';
      const DEFAULT_FILTER = 'default';
      // The default view is the work queue: what is new, what moved, what the
      // box model says is a repairable CSS defect, and what is already promoted
      // to a contract — a promoted rule is the one a regression would break.
      // A `wont-fix` finding is a decision, and a `fixed` one is already done:
      // neither is work, so neither belongs in the queue however it classifies.
      const isDefaultDetail = (detail) =>
        detailStatus(detail) !== 'wont-fix' &&
        detailStatus(detail) !== 'fixed' &&
        (detailStatus(detail) === 'new' ||
          detailStatus(detail) === 'changed' ||
          detailStatus(detail) === 'promoted' ||
          detail.classification === 'css-defect');

      const statusCounts = new Map();
      for (const detail of report.details) {
        const status = detailStatus(detail);
        statusCounts.set(status, (statusCounts.get(status) ?? 0) + 1);
      }

      const filters = [
        [
          DEFAULT_FILTER,
          '默认（新增 + 变化 + CSS 缺陷 + 已提升）',
          report.details.filter(isDefaultDetail).length,
          null,
        ],
        ['all', '全部', report.details.length, null],
        ...STATUS_ORDER.map((status) => [
          `status:${status}`,
          STATUS_LABELS[status],
          statusCounts.get(status) ?? 0,
          status === 'new' || status === 'changed' || status === 'debt'
            ? 'dot--candidate'
            : 'dot--insufficient',
        ]),
        ['css-defect', 'CSS 缺陷', cssDefects.length, 'dot--fail'],
        ['structural', '结构性', structural.length, 'dot--candidate'],
        ['optical-residual', '视觉余量', opticalResiduals.length, 'dot--insufficient'],
        ['violation', '违规', violations.length, 'dot--fail'],
        ['review', '待确认', reviewCandidates.length, 'dot--candidate'],
        ['overview', '整体视图', overviews.length, null],
        ['jitter', '亚像素抖动', jitters.length, 'dot--candidate'],
        ['measurement-model', '测量模型分歧', measurementModels.length, 'dot--candidate'],
        [
          'cross-family-candidate',
          '跨行族候选轨',
          crossFamilyCandidates.length,
          'dot--insufficient',
        ],
        ['insufficient', '证据不足', insufficient.length, 'dot--insufficient'],
        ['stable', '稳定候选轨', stableCandidates.length, 'dot--candidate'],
      ];

      function matchesFilter(review, kind) {
        if (kind === 'all') return true;
        if (kind === DEFAULT_FILTER) return review.dataset.default === 'true';
        if (kind.startsWith('status:')) return review.dataset.ledgerStatus === kind.slice(7);
        return (
          review.dataset.kind === kind ||
          review.dataset.classification === kind ||
          (kind === 'review' && review.dataset.requiresReview === 'true') ||
          (kind === 'stable' &&
            review.dataset.kind === 'candidate' &&
            review.dataset.requiresReview === 'false')
        );
      }

      function applyFilter(kind) {
        for (const chip of toolbar.querySelectorAll('.chip')) {
          chip.setAttribute('aria-pressed', String(chip.dataset.filter === kind));
        }
        for (const section of reviewsEl.querySelectorAll('.detail-section')) {
          let visible = 0;
          for (const review of section.querySelectorAll('.detail-review')) {
            const matches = matchesFilter(review, kind);
            review.hidden = !matches;
            if (matches) visible += 1;
          }
          section.hidden = visible === 0;
          const heading = section.previousElementSibling;
          if (heading && heading.classList.contains('detail-section-heading')) {
            heading.hidden = visible === 0;
            heading.querySelector('.count').textContent = `${visible} / ${
              section.querySelectorAll('.detail-review').length
            }`;
          }
        }
      }

      // A default view that matched nothing would render an empty report with no
      // chip pressed, so fall back to showing everything.
      const initialFilter =
        report.details.filter(isDefaultDetail).length > 0 ? DEFAULT_FILTER : 'all';

      for (const [kind, label, count, dotClass] of filters) {
        if (count === 0) continue;
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.filter = kind;
        chip.setAttribute('aria-pressed', String(kind === initialFilter));
        if (dotClass) {
          const dot = document.createElement('span');
          dot.className = `dot ${dotClass}`;
          chip.append(dot);
        }
        chip.append(label, ' ');
        const countSpan = document.createElement('span');
        countSpan.className = 'count mono';
        countSpan.textContent = count;
        chip.append(countSpan);
        chip.addEventListener('click', () => applyFilter(kind));
        toolbar.append(chip);
      }

      // ---------- lightbox ----------

      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightboxLink = document.getElementById('lightbox-link');

      function openLightbox(source, label, alt) {
        lightboxImage.src = source;
        lightboxImage.alt = alt;
        lightboxCaption.textContent = label;
        lightboxLink.href = source;
        lightbox.showModal();
      }

      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) lightbox.close();
      });

      // ---------- detail rows ----------

      const groupedDetails = [...report.details].sort((left, right) => {
        const statusDelta =
          STATUS_ORDER.indexOf(detailStatus(left)) - STATUS_ORDER.indexOf(detailStatus(right));
        if (statusDelta !== 0) return statusDelta;
        return (
          CLASSIFICATION_ORDER.indexOf(left.classification ?? '') -
          CLASSIFICATION_ORDER.indexOf(right.classification ?? '')
        );
      });
      const sectionsByStatus = new Map();
      function sectionFor(status) {
        const existing = sectionsByStatus.get(status);
        if (existing) return existing;
        const heading = document.createElement('h2');
        heading.className = 'detail-section-heading';
        const title = document.createElement('span');
        title.textContent = STATUS_LABELS[status] ?? status;
        const count = document.createElement('span');
        count.className = 'count mono';
        heading.append(title, count);
        const section = document.createElement('section');
        section.className = 'detail-section';
        reviewsEl.append(heading, section);
        sectionsByStatus.set(status, section);
        return section;
      }

      groupedDetails.forEach((detail, index) => {
        const review = document.createElement('article');
        review.className = 'detail-review';
        review.dataset.kind = detail.kind;
        review.dataset.requiresReview = String(Boolean(detail.requiresReview));
        review.dataset.ledgerStatus = detailStatus(detail);
        review.dataset.default = String(isDefaultDetail(detail));
        if (detail.classification) review.dataset.classification = detail.classification;
        const open =
          detail.kind === 'violation' ||
          Boolean(detail.requiresReview) ||
          (detail.kind === 'overview' && detail === overviews[0]);
        review.dataset.open = String(open);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'detail-toggle';
        toggle.setAttribute('aria-expanded', String(open));

        const indexSpan = document.createElement('span');
        indexSpan.className = 'detail-index mono';
        indexSpan.textContent = String(index + 1).padStart(2, '0');

        const dot = document.createElement('span');
        dot.className = `dot ${
          detail.kind === 'violation' || detail.classification === 'css-defect'
            ? 'dot--fail'
            : detail.kind === 'insufficient' || detail.classification === 'optical-residual'
              ? 'dot--insufficient'
              : 'dot--candidate'
        }`;

        const copy = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'detail-title';
        if (detail.ledgerStatus) {
          const badge = document.createElement('span');
          badge.className = 'status-badge';
          badge.textContent = STATUS_LABELS[detail.ledgerStatus] ?? detail.ledgerStatus;
          title.append(badge);
        }
        title.append(detail.title);
        const description = document.createElement('p');
        description.className = 'detail-description';
        description.textContent = detail.description;
        copy.append(title, description);

        const finding = document.createElement('span');
        finding.className = 'detail-finding mono';
        finding.textContent = detail.finding;

        toggle.append(indexSpan, dot, copy, finding);
        toggle.insertAdjacentHTML('beforeend', chevronSvg);

        const body = document.createElement('div');
        body.className = 'detail-body';
        const inner = document.createElement('div');
        inner.className = 'detail-body-inner';

        const facts = [];
        if (detail.classification) {
          facts.push(
            `分类 ${CLASSIFICATION_LABELS[detail.classification] ?? detail.classification}`
          );
        }
        if (detail.ledgerStatus) {
          facts.push(`Ledger ${STATUS_LABELS[detail.ledgerStatus] ?? detail.ledgerStatus}`);
        }
        if (detail.currentOffset !== undefined) {
          const baseline =
            detail.baselineOffset === undefined
              ? '无基线'
              : `基线 ${detail.baselineOffset.toFixed(2)}px`;
          facts.push(`${baseline} → 当前 ${detail.currentOffset.toFixed(2)}px`);
        }
        if (detail.captureCount !== undefined) {
          facts.push(`${detail.captureCount}/${detail.totalCaptureCount} 个捕获`);
        }
        facts.push(
          detail.dimensionSensitivity && detail.dimensionSensitivity.length > 0
            ? `维度敏感 ${detail.dimensionSensitivity.join('、')}`
            : detail.ledgerStatus
              ? '无维度敏感'
              : null
        );
        const factsEl = document.createElement('p');
        factsEl.className = 'detail-facts mono';
        for (const fact of facts.filter(Boolean)) {
          const span = document.createElement('span');
          span.textContent = fact;
          factsEl.append(span);
        }
        if (factsEl.childElementCount > 0) inner.append(factsEl);
        // One card per REPAIR: the findings folded into it are named, so a
        // reviewer can see they were reviewed rather than dropped.
        const foldedKeys = detail.repairGroupKeys ?? [];
        const foldedText =
          foldedKeys.length > 0
            ? `同一处修复覆盖 ${foldedKeys.length + 1} 条 finding：${foldedKeys.join('、')}`
            : undefined;
        for (const text of [detail.repairProposal, foldedText, detail.inkCenterWitness]) {
          if (!text) continue;
          const paragraph = document.createElement('p');
          paragraph.className = 'detail-repair';
          paragraph.textContent = text;
          inner.append(paragraph);
        }

        const pair = document.createElement('div');
        pair.className = 'detail-pair';
        if (detail.images.after) pair.classList.add('has-after');

        const annotatedLabel =
          detail.kind === 'candidate'
            ? '候选轨与偏移'
            : detail.kind === 'overview'
              ? '候选轨总览'
              : detail.kind === 'cross-family-candidate'
                ? '跨行族候选轨'
                : detail.kind === 'jitter'
                  ? '亚像素抖动'
                  : detail.kind === 'measurement-model'
                    ? '测量模型分歧'
                    : detail.kind === 'insufficient'
                      ? '证据不足'
                      : '失败语义线';
        const figures = [
          ['原始界面', detail.images.clean, `${detail.title} 原始局部截图`],
          [annotatedLabel, detail.images.annotated, `${detail.title} ${annotatedLabel}局部截图`],
        ];
        if (detail.images.after) {
          figures.push(['修复后', detail.images.after, `${detail.title} 修复后局部截图`]);
        }
        for (const [label, source, alt] of figures) {
          const figure = document.createElement('figure');
          const frame = document.createElement('button');
          frame.type = 'button';
          frame.className = 'figure-frame';
          frame.setAttribute('aria-label', `放大查看：${label}`);
          const image = document.createElement('img');
          image.loading = 'lazy';
          image.src = source;
          image.alt = alt;
          frame.append(image);
          frame.addEventListener('click', () =>
            openLightbox(source, `${detail.title} · ${label}`, alt)
          );
          figure.append(frame);
          const caption = document.createElement('figcaption');
          const captionLabel = document.createElement('span');
          captionLabel.textContent = label;
          caption.append(captionLabel);
          const link = document.createElement('a');
          link.href = source;
          link.target = '_blank';
          link.rel = 'noreferrer';
          link.textContent = '打开 2× PNG ↗';
          caption.append(link);
          figure.append(caption);
          pair.append(figure);
        }

        inner.append(pair);
        body.append(inner);

        toggle.addEventListener('click', () => {
          const next = review.dataset.open !== 'true';
          review.dataset.open = String(next);
          toggle.setAttribute('aria-expanded', String(next));
        });

        review.append(toggle, body);
        sectionFor(detailStatus(detail)).append(review);
      });

      applyFilter(initialFilter);
    </script>
  </body>
</html>
