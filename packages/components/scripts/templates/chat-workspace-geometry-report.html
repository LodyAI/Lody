<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lody 几何对齐报告</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: light-dark(#f6f7f8, #09090b);
        color: light-dark(#18181b, #f4f4f5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .report {
        width: min(1480px, 100%);
        margin-inline: auto;
        padding: 32px;
      }

      .report-header,
      .section-header,
      .detail-heading,
      figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 17px;
      }

      h3 {
        font-size: 15px;
      }

      .subtitle,
      .timestamp,
      .detail-description,
      figcaption {
        color: light-dark(#71717a, #a1a1aa);
      }

      .subtitle {
        margin-top: 8px;
        font-size: 13px;
      }

      .status,
      .detail-finding {
        color: light-dark(#be123c, #fda4af);
        font:
          650 12px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }

      .status {
        border: 1px solid light-dark(#fecdd3, #881337);
        border-radius: 8px;
        background: light-dark(#fff1f2, #4c0519);
        padding: 8px 10px;
      }

      section {
        margin-top: 32px;
      }

      .detail-reviews {
        margin-top: 14px;
        border-block: 1px solid light-dark(#d4d4d8, #3f3f46);
      }

      .detail-review {
        padding-block: 24px;
      }

      .detail-review + .detail-review {
        border-top: 1px solid light-dark(#e4e4e7, #27272a);
      }

      .detail-heading {
        align-items: end;
        margin-bottom: 12px;
      }

      .detail-description {
        margin-top: 5px;
        font-size: 12px;
      }

      .detail-finding {
        text-align: right;
      }

      .detail-review[data-kind='candidate'] .detail-finding {
        color: light-dark(#a16207, #facc15);
      }

      .detail-pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      figure {
        margin: 0;
        padding: 8px;
        border: 1px solid light-dark(#e4e4e7, #27272a);
        border-radius: 8px;
        background: light-dark(#ffffff, #18181b);
      }

      figure img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid light-dark(#e4e4e7, #3f3f46);
        border-radius: 6px;
        background: #ffffff;
      }

      figcaption {
        padding: 9px 3px 1px;
        font-size: 12px;
      }

      figcaption strong {
        color: light-dark(#18181b, #f4f4f5);
      }

      figcaption a {
        color: inherit;
      }

      @media (max-width: 920px) {
        .report {
          padding: 20px;
        }

        .report-header,
        .detail-heading {
          align-items: flex-start;
          flex-direction: column;
        }

        .detail-finding {
          text-align: left;
        }

        .detail-pair {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .report {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main class="report">
      <header class="report-header">
        <div>
          <h1>几何对齐报告</h1>
          <p class="subtitle">已确认的语义线违规与待确认的候选轨；每项都有原图和标注图。</p>
        </div>
        <span class="status" id="status"></span>
      </header>

      <section aria-labelledby="violations-title">
        <div class="section-header">
          <h2 id="violations-title">逐项检查</h2>
          <span class="timestamp" id="timestamp"></span>
        </div>
        <div class="detail-reviews" id="detail-reviews"></div>
      </section>
    </main>

    <script>
      const report = __GEOMETRY_REPORT_DATA__;
      const details = document.getElementById('detail-reviews');
      document.getElementById('status').textContent =
        `${report.details.length} 组检查 · ${report.contractProposals.length} 个 Contract 候选`;
      document.getElementById('timestamp').textContent = new Date(
        report.generatedAt
      ).toLocaleString();

      report.details.forEach((detail) => {
        const review = document.createElement('article');
        review.className = 'detail-review';
        review.dataset.kind = detail.kind;

        const heading = document.createElement('div');
        heading.className = 'detail-heading';
        const copy = document.createElement('div');
        const title = document.createElement('h3');
        title.textContent = detail.title;
        const description = document.createElement('p');
        description.className = 'detail-description';
        description.textContent = detail.description;
        copy.append(title, description);
        const finding = document.createElement('span');
        finding.className = 'detail-finding';
        finding.textContent = detail.finding;
        heading.append(copy, finding);

        const pair = document.createElement('div');
        pair.className = 'detail-pair';
        const annotatedLabel = detail.kind === 'candidate' ? '候选轨与偏移' : '失败语义线';
        for (const [label, source, alt] of [
          ['原始界面', detail.images.clean, `${detail.title} 原始局部截图`],
          [annotatedLabel, detail.images.annotated, `${detail.title} ${annotatedLabel}局部截图`],
        ]) {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          image.src = source;
          image.alt = alt;
          const caption = document.createElement('figcaption');
          const captionLabel = document.createElement('strong');
          captionLabel.textContent = label;
          const link = document.createElement('a');
          link.href = source;
          link.target = '_blank';
          link.rel = 'noreferrer';
          link.textContent = '打开 2× PNG';
          caption.append(captionLabel, link);
          figure.append(image, caption);
          pair.append(figure);
        }

        review.append(heading, pair);
        details.append(review);
      });
    </script>
  </body>
</html>
