name: macOS product tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-products-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CI: true
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.23.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lody prepare:acp-adapters
      # Preserve Darwin-only branches previously executed by the private Mac check.
      - run: pnpm test:ci

  pr-cli:
    name: macOS CLI tests
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CI: true
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select CI scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node .github/scripts/select-ci-scope.mjs \
            --event pull_request --base-sha "$PR_BASE_SHA" --head-sha "${{ github.sha }}" \
            --workspace-root . --labels "$PR_LABELS" --json-out "$RUNNER_TEMP/ci-scope.json"
      - name: Plan CLI tests
        id: plan
        continue-on-error: true
        run: |
          node .github/scripts/run-ci-tests.mjs --scope "$RUNNER_TEMP/ci-scope.json" \
            --group cli --plan >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-workspace
        if: steps.plan.outputs.run != 'false'
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        if: steps.plan.outputs.run != 'false'
        env:
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile
      - name: Prepare ACP adapters
        if: steps.plan.outputs.run != 'false'
        run: pnpm --filter lody prepare:acp-adapters
      - name: Run full CLI suite on Darwin
        if: steps.plan.outputs.run != 'false'
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: commit.gpgSign
          GIT_CONFIG_VALUE_0: 'false'
        run: pnpm --filter lody test --maxWorkers=2
