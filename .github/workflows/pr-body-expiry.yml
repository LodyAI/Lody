name: PR body expiry

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-body-expiry-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: false

jobs:
  reclose-expired:
    name: Keep expired PR closed
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # This workflow has a write-capable token. Read policy from the trusted
      # default-branch revision at github.sha, never the PR head or a possibly
      # stale pull_request.base.sha.
      - name: Checkout trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Close an expired PR again
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body-policy.mjs`
            ).href)
            const pullRequest = context.payload.pull_request
            if (!policy.shouldEnforcePullRequest(pullRequest)) {
              await policy.clearPullRequestPolicyState({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullRequest,
              })
              return
            }
            if (!policy.hasPullRequestLabel(pullRequest, policy.EXPIRED_BODY_LABEL.name)) {
              core.info('PR is not expired; leaving it open.')
              return
            }
            await policy.expirePullRequest({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullRequest,
            })

  audit:
    name: Audit unresolved PR bodies
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # Scheduled and manual audits read policy from the trusted default branch;
      # never check out or execute the pull request head.
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile and expire PR body states
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const checker = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/check-pr-body.mjs`
            ).href)
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body-policy.mjs`
            ).href)
            const owner = context.repo.owner
            const repo = context.repo.repo
            const now = new Date()
            const failures = []

            await policy.ensurePolicyLabels(github, owner, repo)
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })

            for (const initialPullRequest of pullRequests) {
              try {
                let pullRequest = initialPullRequest
                if (!policy.shouldEnforcePullRequest(pullRequest)) {
                  if (
                    policy.hasPullRequestLabel(pullRequest, policy.NEEDS_BODY_LABEL.name) ||
                    policy.hasPullRequestLabel(pullRequest, policy.EXPIRED_BODY_LABEL.name)
                  ) {
                    await policy.clearPullRequestPolicyState({ github, owner, repo, pullRequest })
                  }
                  continue
                }

                if (policy.hasPullRequestLabel(pullRequest, policy.EXPIRED_BODY_LABEL.name)) {
                  await policy.expirePullRequest({ github, owner, repo, pullRequest })
                  continue
                }

                let result = checker.checkPullRequestBody(pullRequest.body)
                if (result.ok) {
                  await policy.clearInvalidPullRequest({ github, owner, repo, pullRequest })
                  continue
                }

                let state = await policy.markInvalidPullRequest({
                  github,
                  owner,
                  repo,
                  pullRequest,
                  findings: policy.formatCheckerFindings(result),
                  now,
                })
                if (!policy.isGracePeriodExpired(state.invalidSince, now)) {
                  continue
                }

                pullRequest = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                })).data
                if (!policy.shouldEnforcePullRequest(pullRequest)) {
                  await policy.clearInvalidPullRequest({ github, owner, repo, pullRequest })
                  continue
                }
                if (policy.hasPullRequestLabel(pullRequest, policy.EXPIRED_BODY_LABEL.name)) {
                  await policy.expirePullRequest({ github, owner, repo, pullRequest })
                  continue
                }

                result = checker.checkPullRequestBody(pullRequest.body)
                if (result.ok) {
                  await policy.clearInvalidPullRequest({ github, owner, repo, pullRequest })
                  continue
                }
                if (!policy.hasPullRequestLabel(pullRequest, policy.NEEDS_BODY_LABEL.name)) {
                  continue
                }

                state = await policy.markInvalidPullRequest({
                  github,
                  owner,
                  repo,
                  pullRequest,
                  findings: policy.formatCheckerFindings(result),
                  now,
                })
                if (policy.isGracePeriodExpired(state.invalidSince, now)) {
                  await policy.expirePullRequest({
                    github,
                    owner,
                    repo,
                    pullRequest,
                    beforeClose: async () => {
                      const latest = (await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: pullRequest.number,
                      })).data
                      return (
                        latest.state === 'open' &&
                        policy.shouldEnforcePullRequest(latest) &&
                        policy.hasPullRequestLabel(latest, policy.NEEDS_BODY_LABEL.name) &&
                        !checker.checkPullRequestBody(latest.body).ok
                      )
                    },
                  })
                }
              } catch (error) {
                failures.push(`#${initialPullRequest.number}: ${error.message}`)
                core.error(`PR #${initialPullRequest.number}: ${error.stack || error.message}`)
              }
            }

            if (failures.length > 0) {
              core.setFailed(`PR body audit failed:\n${failures.join('\n')}`)
            }
