name: Plugin integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  plugin-integration:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.23.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/electron build:cli
      - name: Reference plugins against the public SDK
        run: node --test scripts/plugin-sdk-contracts.test.mjs
      - name: Confirmed composer text against personal-device signing and machine verification
        run: pnpm --dir packages/loro-streams-rpc exec vitest run tests/e2ee-native.test.ts
      - name: Machine lifecycle, compiler, package integrity and installation
        run: >-
          pnpm --dir apps/cli exec vitest run
          src/plugins/workflow/plugin-host.test.ts
          tests/plugin-compiler-process.test.ts
          src/plugins/plugin-build.test.ts
          src/plugins/plugin-package.test.ts
      - run: pnpm --dir e2e exec playwright install chromium webkit
      - name: Direct HTTPS npm, corrupt archive rejection and two-tab verified cache (Chromium and WebKit)
        run: pnpm --dir packages/components exec node tests/plugin-release-browser.integration.mjs
      - name: Host approval, offline restore, target routing, transcript and proposal components
        run: >-
          pnpm --dir packages/components exec vitest run
          tests/client-plugin-host.test.ts tests/plugin-transcript.test.tsx
          tests/plugin-proposal.test.tsx tests/workspace-machine-rpc-facade.test.ts
      - name: Separate pack and preview CLI processes, desktop Web and compact WebKit
        run: node e2e/scripts/plugin-package-preview.mjs
      - run: pnpm --dir apps/electron sync:cli && pnpm --dir apps/electron build:app
      - name: Electron settings import and unapproved pin disclosure across a deep-link reload
        run: pnpm --dir e2e exec tsx scripts/plugin-settings-pin.ts
      - name: Safe-mode Electron denies module custody at the main-process boundary
        run: pnpm --dir e2e exec tsx scripts/plugin-safe-mode.ts
  capacitor-package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.23.4'
      - run: pnpm install --frozen-lockfile
      - name: Build the production Capacitor renderer and copy it into the iOS app
        working-directory: apps/mobile-capacitor
        run: |
          pnpm run build
          pnpm exec cap copy ios
          cmp dist/index.html ios/App/App/public/index.html
          diff -qr dist/assets ios/App/App/public/assets
  android-webview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          node-version: '22.23.4'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/electron build:cli
      - name: Build the Capacitor debug APK with a test-only registry asset directory
        env:
          VITE_CONVEX_SITE_URL: https://site.example.invalid
          VITE_CONVEX_DEPLOY_URL: https://deployment.example.invalid
          VITE_SERVER_URL: https://api.example.invalid
        run: |
          pnpm --dir apps/mobile-capacitor run build
          pnpm --dir apps/mobile-capacitor exec cap sync android
          node apps/mobile-capacitor/scripts/normalize-android-gradle-paths.mjs
          node packages/components/tests/plugin-capacitor-debug-assets.mjs
          cd apps/mobile-capacitor/android && ./gradlew :app:assembleDebug
      - name: Installed Android WebView verifies packed bytes and restores its IndexedDB after reload
        run: |
          sudo setfacl -m u:"$USER":rw /dev/kvm
          echo no | avdmanager create avd -n plugin -k 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd plugin -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          # The nested shell polls the emulator inside the startup deadline.
          # shellcheck disable=SC2016
          timeout 300 bash -c 'adb wait-for-device; until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 1; done'
          adb install apps/mobile-capacitor/android/app/build/outputs/apk/debug/*.apk
          node e2e/scripts/plugin-capacitor-webview.mjs
