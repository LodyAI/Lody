name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.23.4'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select CI scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node .github/scripts/select-ci-scope.mjs \
            --event "${{ github.event_name }}" \
            --base-sha "${PR_BASE_SHA}" \
            --head-sha "${{ github.sha }}" \
            --workspace-root . \
            --labels "${PR_LABELS}" \
            --json-out "$RUNNER_TEMP/ci-scope.json"

      - name: YAML fail-open override
        id: override
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Identical block in Static checks and Tests. Write force_full once.
          # Default fail-open; only a successful allowlist miss may set false.
          force=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" \
              && git diff -z --name-only "$PR_BASE_SHA" HEAD >/tmp/ci-changed-files; then
              force=false
              while IFS= read -r -d '' f; do
                [ -z "$f" ] && continue
                case "$f" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/scripts/*|.github/workflows/*)
                    force=true
                    break
                    ;;
                esac
              done < /tmp/ci-changed-files
            fi
          fi
          echo "force_full=${force}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          # Static checks do not launch Electron.
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Test contribution policy
        run: node --test .github/scripts/*.test.mjs

      - name: Check document maintenance
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Gates apply to files this PR changed, so compare against the main commit
            # the checked-out merge commit was built on (its first parent), not the
            # possibly stale pull_request.base.sha. The shallow checkout still records
            # the parent ids; fetch only that commit.
            base="$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)"
            git fetch --no-tags --depth=1 origin "$base"
            pnpm run docs check --base "$base"
          else
            pnpm run docs check
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck (forced full)
        if: steps.override.outputs.force_full == 'true'
        run: pnpm typecheck

      - name: Typecheck
        if: steps.override.outputs.force_full != 'true' && steps.scope.outputs.run_typecheck != 'false'
        run: node .github/scripts/run-ci-typecheck.mjs --scope "$RUNNER_TEMP/ci-scope.json"

      - name: Lint and check repository boundaries
        if: steps.override.outputs.force_full == 'true' || steps.scope.outputs.run_check_quick != 'false'
        run: pnpm check:quick

  # The components and cli suites are CPU-bound on a 4-vCPU runner, so they run
  # on their own runners (components in three Vitest shards). See
  # .agents/notes/implemented/testing/2026-09-26-ci-test-groups-and-pnpm-store-cache.md.
  test-groups:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: components, shard: 1/3, label: components 1/3 }
          - { group: components, shard: 2/3, label: components 2/3 }
          - { group: components, shard: 3/3, label: components 3/3 }
          - { group: cli, shard: '', label: cli }
          - { group: rest, shard: '', label: rest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select CI scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node .github/scripts/select-ci-scope.mjs \
            --event "${{ github.event_name }}" \
            --base-sha "${PR_BASE_SHA}" \
            --head-sha "${{ github.sha }}" \
            --workspace-root . \
            --labels "${PR_LABELS}" \
            --json-out "$RUNNER_TEMP/ci-scope.json"

      - name: YAML fail-open override
        id: override
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Must stay byte-identical to the Static checks override (do not
          # move this floor into select-ci-scope.mjs — that script is untrusted).
          force=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" \
              && git diff -z --name-only "$PR_BASE_SHA" HEAD >/tmp/ci-changed-files; then
              force=false
              while IFS= read -r -d '' f; do
                [ -z "$f" ] && continue
                case "$f" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/scripts/*|.github/workflows/*)
                    force=true
                    break
                    ;;
                esac
              done < /tmp/ci-changed-files
            fi
          fi
          echo "force_full=${force}" >> "$GITHUB_OUTPUT"

      - name: Plan test group
        id: plan
        # Fail open: a missing `run` output runs the group.
        continue-on-error: true
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          FORCE_FULL: ${{ steps.override.outputs.force_full }}
        run: |
          full=()
          [ "$FORCE_FULL" = "false" ] || full=(--full)
          node .github/scripts/run-ci-tests.mjs --scope "$RUNNER_TEMP/ci-scope.json" \
            --group "$GROUP" --shard "$SHARD" "${full[@]}" --plan >> "$GITHUB_OUTPUT"

      - name: Skip group for docs-only / unaffected scope
        if: steps.plan.outputs.run == 'false'
        run: |
          echo "Skipping ${{ matrix.label }}: ${{ steps.scope.outputs.reason }}"

      - name: Install dependencies
        if: steps.plan.outputs.run != 'false'
        env:
          # These suites run under Node/Vitest; desktop E2E installs Electron separately.
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Prepare ACP adapters
        if: steps.plan.outputs.run != 'false'
        run: pnpm --filter lody prepare:acp-adapters

      - name: Run tests
        if: steps.plan.outputs.run != 'false'
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          FORCE_FULL: ${{ steps.override.outputs.force_full }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: commit.gpgSign
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          full=()
          [ "$FORCE_FULL" = "false" ] || full=(--full)
          node .github/scripts/run-ci-tests.mjs --scope "$RUNNER_TEMP/ci-scope.json" \
            --group "$GROUP" --shard "$SHARD" "${full[@]}"

  # Chromium only: WebKit needs apt system libraries that exceed this job's budget, so
  # WebKit and the other browser suites stay in the manual e2ee-acceptance.yml.
  # Not a dependency of the required Tests check.
  browser-tests:
    name: Browser tests (E2EE client, Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select browser test scope
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            run=false
            # Fail open: an unreadable base runs the job.
            if ! git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" \
              || ! git diff --name-only "$PR_BASE_SHA" HEAD >/tmp/browser-changed-files; then
              run=true
            elif grep -qE '^(packages/(e2ee-client|e2ee-core|platform|cloud-api|shared|loro-streams-rpc)/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' /tmp/browser-changed-files; then
              run=true
            fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Set up workspace toolchain
        if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install browser test dependencies
        if: steps.paths.outputs.run == 'true'
        # The logout and cache recovery case bundles the real component implementations.
        run: pnpm --filter @lody/e2ee-client... --filter @lody/components... --filter acp-extension-core... --filter acp-extension-dsh... install --frozen-lockfile --ignore-scripts

      - name: Resolve Playwright cache
        id: playwright
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(pnpm --filter @lody/e2ee-client exec playwright --version | awk '{print $2}')
          echo "key=playwright-chromium-${RUNNER_OS}-${RUNNER_ARCH}-${version}" >> "$GITHUB_OUTPUT"

      # Restore everywhere; only main pushes save, as with the pnpm store.
      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.paths.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      - name: Install Chromium
        if: steps.paths.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        # The runner image already carries Chromium's system libraries.
        run: pnpm --filter @lody/e2ee-client exec playwright install chromium

      - name: Save Playwright browsers
        if: steps.paths.outputs.run == 'true' && github.event_name == 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      - name: Build shared RPC schema dependencies
        if: steps.paths.outputs.run == 'true'
        run: |
          pnpm --filter acp-extension-core build
          pnpm --filter acp-extension-dsh build

      - name: Run E2EE client browser tests in Chromium
        if: steps.paths.outputs.run == 'true'
        run: pnpm --filter @lody/e2ee-client exec vitest run --config vitest.browser.config.ts -t '^(?!.*\bwebkit\b)'

  # Stable required check: green only when every group succeeded.
  # Cancellation supersedes this run; do not turn cancelled groups into a failure.
  tests:
    name: Tests
    needs: test-groups
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test group
        env:
          RESULT: ${{ needs.test-groups.result }}
        run: |
          echo "Test groups: $RESULT"
          [ "$RESULT" = "success" ]
