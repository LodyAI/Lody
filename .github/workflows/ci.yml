name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.23.4'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select CI scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node .github/scripts/select-ci-scope.mjs \
            --event "${{ github.event_name }}" \
            --base-sha "${PR_BASE_SHA}" \
            --head-sha "${{ github.sha }}" \
            --workspace-root . \
            --labels "${PR_LABELS}" \
            --json-out "$RUNNER_TEMP/ci-scope.json"

      - name: YAML fail-open override
        id: override
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Identical block in Static checks and Tests (do not move this floor
          # into select-ci-scope.mjs — that script is untrusted).
          force=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if (git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$PR_BASE_SHA") \
              && git diff -z --name-only "$PR_BASE_SHA" HEAD >/tmp/ci-changed-files; then
              force=false
              while IFS= read -r -d '' f; do
                [ -z "$f" ] && continue
                case "$f" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/scripts/*|.github/workflows/*)
                    force=true
                    break
                    ;;
                esac
              done < /tmp/ci-changed-files
            fi
          fi
          echo "force_full=${force}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        env:
          # Static checks do not launch Electron.
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Test contribution policy
        run: node --test .github/scripts/*.test.mjs

      - name: Check document maintenance
        env:
          IS_STABLE_PROMOTION: ${{ github.event_name == 'pull_request' && github.base_ref == 'release' && github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Ordinary PRs compare with the merge's target parent. Stable promotion
            # carries already-integrated main history, so check only changes the
            # merge adds to its source parent instead of reclassifying old notes.
            parent=1
            if [ "$IS_STABLE_PROMOTION" = "true" ]; then
              parent=2
            fi
            base="$(git cat-file -p HEAD | sed -n 's/^parent //p' | sed -n "${parent}p")"
            test -n "$base"
            git cat-file -e "${base}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"
            pnpm run docs check --base "$base"
          else
            pnpm run docs check
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck (forced full)
        if: steps.override.outputs.force_full == 'true'
        run: pnpm typecheck

      - name: Typecheck
        if: steps.override.outputs.force_full != 'true' && steps.scope.outputs.run_typecheck != 'false'
        run: node .github/scripts/run-ci-typecheck.mjs --scope "$RUNNER_TEMP/ci-scope.json"

      - name: Lint and check repository boundaries
        if: steps.override.outputs.force_full == 'true' || steps.scope.outputs.run_check_quick != 'false'
        run: pnpm check:quick

  # The components and cli suites are CPU-bound on a 4-vCPU runner, so they run
  # on their own sharded runners (two Vitest shards each). See
  # .agents/notes/implemented/testing/2026-09-26-ci-test-groups-and-pnpm-store-cache.md.
  test-groups:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: components, shard: 1/2, label: components 1/2 }
          - { group: components, shard: 2/2, label: components 2/2 }
          - { group: cli, shard: 1/2, label: cli 1/2 }
          - { group: cli, shard: 2/2, label: cli 2/2 }
          - { group: rest, shard: '', label: rest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select CI scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node .github/scripts/select-ci-scope.mjs \
            --event "${{ github.event_name }}" \
            --base-sha "${PR_BASE_SHA}" \
            --head-sha "${{ github.sha }}" \
            --workspace-root . \
            --labels "${PR_LABELS}" \
            --json-out "$RUNNER_TEMP/ci-scope.json"

      - name: YAML fail-open override
        id: override
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Identical block in Static checks and Tests (do not move this floor
          # into select-ci-scope.mjs — that script is untrusted).
          force=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if (git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$PR_BASE_SHA") \
              && git diff -z --name-only "$PR_BASE_SHA" HEAD >/tmp/ci-changed-files; then
              force=false
              while IFS= read -r -d '' f; do
                [ -z "$f" ] && continue
                case "$f" in
                  package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.github/scripts/*|.github/workflows/*)
                    force=true
                    break
                    ;;
                esac
              done < /tmp/ci-changed-files
            fi
          fi
          echo "force_full=${force}" >> "$GITHUB_OUTPUT"

      - name: Plan test group
        id: plan
        # Fail open: a missing `run` output runs the group.
        continue-on-error: true
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          FORCE_FULL: ${{ steps.override.outputs.force_full }}
        run: |
          full=()
          [ "$FORCE_FULL" = "false" ] || full=(--full)
          node .github/scripts/run-ci-tests.mjs --scope "$RUNNER_TEMP/ci-scope.json" \
            --group "$GROUP" --shard "$SHARD" "${full[@]}" --plan >> "$GITHUB_OUTPUT"

      - name: Skip group for docs-only / unaffected scope
        if: steps.plan.outputs.run == 'false'
        run: |
          echo "Skipping ${{ matrix.label }}: ${{ steps.scope.outputs.reason }}"

      - name: Set up workspace toolchain
        if: steps.plan.outputs.run != 'false'
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        if: steps.plan.outputs.run != 'false'
        env:
          # These suites run under Node/Vitest; desktop E2E installs Electron separately.
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Prepare ACP adapters
        if: steps.plan.outputs.run != 'false'
        run: |
          if [ "${{ matrix.group }}" = "cli" ]; then
            pnpm --filter lody prepare:acp-adapters
          else
            pnpm --filter acp-extension-dsh build
          fi

      - name: Run tests
        if: steps.plan.outputs.run != 'false'
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}
          FORCE_FULL: ${{ steps.override.outputs.force_full }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: commit.gpgSign
          GIT_CONFIG_VALUE_0: 'false'
        run: |
          full=()
          [ "$FORCE_FULL" = "false" ] || full=(--full)
          node .github/scripts/run-ci-tests.mjs --scope "$RUNNER_TEMP/ci-scope.json" \
            --group "$GROUP" --shard "$SHARD" "${full[@]}"

  # Builds the iroh Node-API module, runs its Rust tests (including a local relay), then
  # the Node suites that exercise the real module and otherwise skip without it.
  # Runs on pushes to main and manual runs only, never on pull requests, so no PR waits
  # on its macOS runner. Not a dependency of the required Tests check.
  iroh-native:
    name: Tests (iroh native, ${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install dependencies
        env:
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: pnpm --filter @lody/iroh-native test:rust

      - name: Generate mobile bindings
        if: runner.os == 'Linux'
        working-directory: packages/iroh-native
        run: |
          cargo build --locked -p lody-iroh-uniffi
          for language in swift kotlin; do
            cargo run --locked -p lody-iroh-uniffi --bin uniffi-bindgen -- generate \
              --library target/debug/liblody_iroh_uniffi.so --language "$language" \
              --out-dir "$RUNNER_TEMP/bindings/$language" --no-format
          done

      - name: Build module
        run: pnpm --filter @lody/iroh-native build:debug

      - name: Prepare ACP adapters
        run: pnpm --filter lody prepare:acp-adapters

      - name: Node tests with the module
        env:
          LODY_IROH_REQUIRE: '1'
        run: |
          pnpm --filter @lody/iroh-native test
          pnpm --dir apps/cli exec vitest run src/lib/e2ee/realtime-rpc.test.ts tests/e2ee-runtime.test.ts tests/e2ee-runtime-pairing.test.ts tests/e2ee-runtime-execution.test.ts

  # Stable required check: green only when every group succeeded.
  # Cancellation supersedes this run; do not turn cancelled groups into a failure.
  tests:
    name: Tests
    needs: test-groups
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test group
        env:
          RESULT: ${{ needs.test-groups.result }}
        run: |
          echo "Test groups: $RESULT"
          [ "$RESULT" = "success" ]
