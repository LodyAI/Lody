name: Desktop E2E Daily failure

on:
  workflow_run:
    workflows: [Desktop E2E Daily]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: desktop-e2e-daily-failure
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Daily failure evidence
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find Daily evidence
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const policy = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-daily-policy.mjs`
            )
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100
            })
            const evidence = policy.findDailyEvidenceArtifact(
              artifacts,
              context.payload.workflow_run.id
            )
            core.setOutput('suite', evidence?.suite ?? 'unknown')
            core.setOutput('artifact-name', evidence?.artifact.name ?? '')
            if (!evidence) core.warning('No unique, unexpired Daily evidence artifact is available.')

      - name: Reconcile Daily failure Issue
        uses: actions/github-script@v7
        env:
          DAILY_ARTIFACT_NAME: ${{ steps.evidence.outputs.artifact-name }}
          DAILY_SUITE: ${{ steps.evidence.outputs.suite }}
        with:
          script: |
            const policy = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-daily-policy.mjs`
            )
            const marker = '<!-- desktop-e2e-daily-failure -->'
            const title = '[E2E] Daily desktop journey failure'
            const conclusion = context.payload.workflow_run.conclusion
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            })
            const existing = policy.findOwnedDailyFailureIssue(issues, marker)

            if (policy.canCloseDailyFailureIssue(conclusion, process.env.DAILY_SUITE)) {
              if (existing?.state === 'open') {
                const runUrl = context.payload.workflow_run.html_url
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Desktop Daily recovered: ${runUrl}`
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed'
                })
              }
              return
            }
            if (conclusion === 'success') {
              core.notice(
                `Daily ${process.env.DAILY_SUITE} succeeded without covering the full failure state.`
              )
              return
            }
            if (conclusion === 'cancelled' || conclusion === 'skipped') {
              return
            }

            const body = [
              marker,
              'The default-branch Desktop Daily regression is failing.',
              '',
              'Each failed round is appended as a comment with its Actions run and artifact name. Failure recordings, traces, screenshots, logs, and runtime evidence remain in Actions artifacts.'
            ].join('\n')
            let issueNumber
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open'
              })
              issueNumber = existing.number
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              })
              issueNumber = created.data.number
            }

            const roundMarker = policy.dailyFailureCommentMarker(context.payload.workflow_run.id)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            })
            if (!policy.hasOwnedComment(comments, roundMarker)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: policy.buildDailyFailureComment({
                  runId: context.payload.workflow_run.id,
                  runUrl: context.payload.workflow_run.html_url,
                  headSha: context.payload.workflow_run.head_sha,
                  artifactName: process.env.DAILY_ARTIFACT_NAME
                })
              })
            }
