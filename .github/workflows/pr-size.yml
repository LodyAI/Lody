name: External PR size

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write

concurrency:
  group: external-pr-size-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: false

jobs:
  warn:
    name: Warn on external PR change limit
    runs-on: ubuntu-latest
    steps:
      # This workflow has a write-capable token. Only load the trusted base or
      # default branch; never check out or execute the pull request head.
      - name: Checkout trusted policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check external pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-size-policy.mjs`
            ).href)
            const owner = context.repo.owner
            const repo = context.repo.repo
            const failures = []
            const numbers = context.eventName === 'pull_request_target'
              ? [context.payload.pull_request.number]
              : (await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                })).map((pullRequest) => pullRequest.number)

            for (const number of numbers) {
              try {
                // Re-read so an edited body or changed diff is never judged
                // from stale event or schedule data.
                const pullRequest = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: number,
                })).data
                await policy.reconcilePullRequestSize({ github, owner, repo, pullRequest })
              } catch (error) {
                failures.push(`#${number}: ${error.message}`)
                core.error(`PR #${number}: ${error.stack || error.message}`)
              }
            }

            if (failures.length > 0) {
              core.setFailed(`External PR size warning failed:\n${failures.join('\n')}`)
            }
