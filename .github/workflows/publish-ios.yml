name: Publish iOS
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      expected_version:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      nightly-version:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  NODE_VERSION: 22.23.4
  NODE_OPTIONS: --max-old-space-size=8192
  LODY_ENV: production
jobs:
  validate-target:
    if:
      github.event_name == 'workflow_dispatch' && inputs.nightly-version == '' && github.ref == 'refs/heads/release' &&
      vars.CLIENT_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      checkout_sha: ${{ steps.target.outputs.checkout_sha }}
      build_number: ${{ steps.target.outputs.build_number }}
      target_environment: ${{ steps.target.outputs.target_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: target
        env:
          TARGET_INPUTS: ${{ toJSON(inputs) }}
          COMPONENT: ios
        with:
          script: >
            const { validateManualTarget } = await
            import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/client-release-target.mjs`);

            const target = await validateManualTarget({github, context, inputs: JSON.parse(process.env.TARGET_INPUTS),
            component: process.env.COMPONENT});

            for (const [key, value] of Object.entries(target)) core.setOutput(key, value);
  publish-ios:
    if:
      ${{ !cancelled() && ((inputs.nightly-version != '' && github.repository == 'LodyAI/Lody' && github.ref ==
      'refs/heads/main' && inputs.source-sha == github.sha && (github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch') && vars.CLIENT_RELEASES_ENABLED == 'true') || needs.validate-target.result == 'success') }}
    runs-on: xcode-27
    concurrency:
      group: mobile-ios-app-store-connect-release
      cancel-in-progress: false
    environment: ${{ inputs.nightly-version != '' && 'cloud-nightly' || 'cloud-production' }}
    env:
      LODY_NIGHTLY_VERSION: ${{ inputs.nightly-version || '' }}
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL || vars.LODY_AUTH_URL }}
      VITE_CONVEX_DEPLOY_URL: ${{ vars.LODY_AUTH_URL }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_SESSION_SHARE_ORIGIN: ${{ vars.VITE_SESSION_SHARE_ORIGIN }}
      VITE_GITHUB_APP_NAME: ${{ vars.VITE_GITHUB_APP_NAME }}
      VITE_ONESIGNAL_APP_ID: ${{ vars.VITE_ONESIGNAL_APP_ID || vars.ONESIGNAL_APP_ID }}
      VITE_ONESIGNAL_SAFARI_WEB_ID: ${{ vars.VITE_ONESIGNAL_SAFARI_WEB_ID || vars.ONESIGNAL_SAFARI_WEB_ID }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || vars.POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY || vars.POSTHOG_KEY }}
      VITE_VIBELOFT_WEB_AUTH_KEY: ${{ vars.VITE_VIBELOFT_WEB_AUTH_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ai.lody.mobile
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha || needs.validate-target.outputs.checkout_sha }}
          persist-credentials: false
          submodules: recursive
      - name: Verify Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          iphoneos_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK version: ${iphoneos_sdk_version}"
          if [[ "${iphoneos_sdk_version%%.*}" -lt 26 ]]; then
            echo "App Store Connect requires iOS 26 SDK or later for iOS uploads."
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm --filter '{./apps/mobile-capacitor}...' --fail-if-no-match install --frozen-lockfile --prefer-offline
        env:
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
      - name: Normalize mobile auth base URL
        shell: bash
        run: |
          set -euo pipefail
          raw_site_url="${VITE_CONVEX_SITE_URL:-${VITE_CONVEX_DEPLOY_URL:-}}"
          if [[ -z "${raw_site_url}" ]]; then
            echo "VITE_CONVEX_SITE_URL=" >> "$GITHUB_ENV"
            exit 0
          fi

          normalized_site_url="${raw_site_url%/}"
          if [[ "${normalized_site_url}" == *".convex.cloud" ]]; then
            normalized_site_url="${normalized_site_url/.convex.cloud/.convex.site}"
          fi

          echo "VITE_CONVEX_SITE_URL=${normalized_site_url}" >> "$GITHUB_ENV"
      - name: Resolve iOS release version
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ inputs.nightly-version }}
        run: >
          set -euo pipefail

          if [[ -n "${NIGHTLY_VERSION}" ]]; then
            version="$(node --input-type=module -e "import { mobileNightlyVersion } from './apps/electron/nightly-mobile.mjs'; console.log(mobileNightlyVersion(process.env.NIGHTLY_VERSION).ios)")"
          else
            version="$(node -p "require('./apps/mobile-capacitor/package.json').version")"
          fi

          if [[ -z "${version}" ]]; then
            echo "Could not resolve iOS release version"
            exit 1
          fi

          echo "MOBILE_VERSION_NAME=${version}" >> "$GITHUB_ENV"
      - name: Validate iOS release configuration
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          required_envs=(
            "VITE_SERVER_URL"
            "VITE_CONVEX_SITE_URL"
            "VITE_CONVEX_DEPLOY_URL"
            "VITE_SITE_URL"
            "VITE_ONESIGNAL_APP_ID"
            "APPLE_TEAM_ID"
            "APPLE_API_KEY_P8"
            "APPLE_API_KEY_ID"
            "APPLE_API_ISSUER"
            "IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64"
            "IOS_DISTRIBUTION_CERTIFICATE_PASSWORD"
            "IOS_APP_PROVISIONING_PROFILE_BASE64"
            "IOS_EXTENSION_PROVISIONING_PROFILE_BASE64"
            "IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64"
            "IOS_BUNDLE_ID"
            "MOBILE_VERSION_NAME"
          )
          for key in "${required_envs[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required iOS release env: ${key}"
              exit 1
            fi
          done
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api_key_dir="${HOME}/.appstoreconnect/private_keys"
          mkdir -p "${api_key_dir}"
          api_key_path="${api_key_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "APPLE_API_KEY_PATH=${api_key_path}" >> "$GITHUB_ENV"
      - name: Reject existing or uncertain iOS recovery uploads
        if: inputs.nightly-version == ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node .github/scripts/ios-release-recovery.mjs
      - name: Resolve iOS build number
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(node .github/scripts/resolve-ios-app-store-build-number.mjs)"
          if [[ -z "${build_number}" ]]; then
            echo "Could not resolve iOS build number"
            exit 1
          fi
          echo "MOBILE_BUILD_NUMBER=${build_number}" >> "$GITHUB_ENV"
          echo "Resolved iOS version ${MOBILE_VERSION_NAME} build ${build_number}"
        if: inputs.nightly-version != ''
      - name: Pin first build for untouched stable version
        if: inputs.nightly-version == ''
        run: echo "MOBILE_BUILD_NUMBER=1" >> "$GITHUB_ENV"
      - name: Prepare iOS signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="${RUNNER_TEMP}/lody-ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="${RUNNER_TEMP}/ios_distribution.p12"

          decode_base64_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local output_path="$3"
            local encoded_path="${output_path}.base64"

            printf '%s' "${secret_value}" |
              sed -e 's/\\n//g' -e 's/\\r//g' |
              tr -d '[:space:]' > "${encoded_path}"
            if [[ ! -s "${encoded_path}" ]]; then
              echo "${secret_name} is empty after removing whitespace"
              exit 1
            fi

            if ! openssl base64 -A -d -in "${encoded_path}" -out "${output_path}"; then
              rm -f "${encoded_path}" "${output_path}"
              echo "${secret_name} must contain base64-encoded file contents."
              echo "Regenerate it with: openssl base64 -A -in <file>"
              exit 1
            fi
            rm -f "${encoded_path}"
          }

          decode_base64_secret \
            "IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" \
            "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64}" \
            "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${keychain_path}" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"

          install_profile() {
            local secret_name="$1"
            local encoded_profile="$2"
            local profile_path="$3"
            local env_key="$4"
            local plist_path="${profile_path}.plist"
            decode_base64_secret "${secret_name}" "${encoded_profile}" "${profile_path}"
            if ! security cms -D -i "${profile_path}" > "${plist_path}"; then
              echo "${secret_name} decoded but is not a valid provisioning profile"
              exit 1
            fi
            local uuid name
            uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${plist_path}")"
            name="$(/usr/libexec/PlistBuddy -c 'Print Name' "${plist_path}")"
            cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "${env_key}=${name}" >> "$GITHUB_ENV"
          }

          install_profile \
            "IOS_APP_PROVISIONING_PROFILE_BASE64" \
            "${IOS_APP_PROVISIONING_PROFILE_BASE64}" \
            "${RUNNER_TEMP}/app.mobileprovision" \
            "IOS_APP_PROFILE_NAME"
          install_profile \
            "IOS_EXTENSION_PROVISIONING_PROFILE_BASE64" \
            "${IOS_EXTENSION_PROVISIONING_PROFILE_BASE64}" \
            "${RUNNER_TEMP}/extension.mobileprovision" \
            "IOS_EXTENSION_PROFILE_NAME"
          install_profile \
            "IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64" \
            "${IOS_LIVE_ACTIVITY_WIDGET_PROVISIONING_PROFILE_BASE64}" \
            "${RUNNER_TEMP}/live-activity-widget.mobileprovision" \
            "IOS_LIVE_ACTIVITY_WIDGET_PROFILE_NAME"
      - name: Sync iOS project
        env:
          MOBILE_CHANNEL: ${{ inputs.nightly-version != '' && 'nightly' || 'stable' }}
        run: |
          if [[ "${MOBILE_CHANNEL}" == nightly ]]; then
            corepack pnpm --filter @lody/mobile-capacitor run ci:sync:ios:nightly
          else
            corepack pnpm --filter @lody/mobile-capacitor run ci:sync:ios
          fi
      - name: Configure manual code signing
        working-directory: apps/mobile-capacitor/ios/App
        shell: bash
        run: |
          set -euo pipefail
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('App.xcodeproj')
          team = ENV.fetch('APPLE_TEAM_ID')
          profiles = {
            'App' => ENV.fetch('IOS_APP_PROFILE_NAME'),
            'OneSignalNotificationServiceExtension' => ENV.fetch('IOS_EXTENSION_PROFILE_NAME'),
            'LodyLiveActivityWidget' => ENV.fetch('IOS_LIVE_ACTIVITY_WIDGET_PROFILE_NAME'),
          }

          profiles.each do |target_name, profile_name|
            target = project.targets.find { |t| t.name == target_name }
            raise "Target #{target_name} not found in App.xcodeproj" unless target

            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              settings = config.build_settings
              settings['CODE_SIGN_STYLE'] = 'Manual'
              settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              settings['PROVISIONING_PROFILE_SPECIFIER'] = profile_name
              settings['DEVELOPMENT_TEAM'] = team
            end
          end

          project.save
          RUBY
      - name: Archive iOS app
        working-directory: apps/mobile-capacitor/ios/App
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/Lody.xcarchive" \
            MARKETING_VERSION="${MOBILE_VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${MOBILE_BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            archive
      - name: Export iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          cat > "${export_options}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ai.lody.mobile</key>
              <string>${IOS_APP_PROFILE_NAME}</string>
              <key>ai.lody.mobile.OneSignalNotificationServiceExtension</key>
              <string>${IOS_EXTENSION_PROFILE_NAME}</string>
              <key>ai.lody.mobile.LodyLiveActivityWidget</key>
              <string>${IOS_LIVE_ACTIVITY_WIDGET_PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/Lody.xcarchive" \
            -exportPath "${RUNNER_TEMP}/LodyIpa" \
            -exportOptionsPlist "${export_options}"
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name:
            ${{ inputs.nightly-version != '' && format('nightly-ios-{0}-{1}', github.run_id, github.run_attempt) ||
            'mobile-ios-ipa' }}
          path: ${{ runner.temp }}/LodyIpa/*.ipa
          if-no-files-found: error
      - name: Wait for same-run SEA verification before Nightly iOS publication
        if: inputs.nightly-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-release-gate.mjs
      - name: Verify exact-version public installer immediately before iOS upload
        run: node apps/cli/check-installer.mjs . "$DAEMON_CHANNEL" "$DAEMON_EXPECTED_VERSION"
        env:
          DAEMON_CHANNEL: ${{ inputs.nightly-version != '' && 'nightly' || 'stable' }}
          DAEMON_EXPECTED_VERSION: ${{ inputs.nightly-version || inputs.expected_version }}
      - name: Reject existing or uncertain iOS recovery uploads
        if: inputs.nightly-version == ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node .github/scripts/ios-release-recovery.mjs
      - name: Upload iOS build to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find "${RUNNER_TEMP}/LodyIpa" -type f -name '*.ipa' | head -n 1)"
          if [[ -z "${ipa_path}" || ! -f "${ipa_path}" ]]; then
            echo "No IPA found"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa_path}" \
            --apiKey "${APPLE_API_KEY_ID}" \
            --apiIssuer "${APPLE_API_ISSUER}"
      - name: Remove iOS signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "${RUNNER_TEMP}/lody-ios-signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/ios_distribution.p12" "${APPLE_API_KEY_PATH:-}"
    needs: validate-target
concurrency:
  group: ${{ inputs.nightly-version != '' && format('ios-nightly-{0}', github.run_id) || 'lody-production-release' }}
  cancel-in-progress: false
