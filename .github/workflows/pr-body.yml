name: Reusable PR body policy

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check PR body format
    runs-on: ubuntu-latest
    steps:
      # This workflow has a write-capable token. Read policy from the trusted
      # default-branch revision at github.sha, never the PR head or a possibly
      # stale pull_request.base.sha.
      - name: Checkout trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine whether PR policy applies
        id: policy
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body-policy.mjs`
            ).href)
            const pullRequest = context.payload.pull_request
            const enforce = policy.shouldEnforcePullRequest(pullRequest)
            core.setOutput('enforce', enforce)
            if (!enforce) {
              await policy.clearPullRequestPolicyState({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                pullRequest,
              })
            }

      - name: Validate PR body
        id: validate
        if: steps.policy.outputs.enforce == 'true'
        continue-on-error: true
        env:
          FINDINGS_FILE: ${{ runner.temp }}/pr-body-check.txt
        run: |
          set +e
          node .github/scripts/check-pr-body.mjs \
            --event-file "$GITHUB_EVENT_PATH" > "$FINDINGS_FILE" 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$FINDINGS_FILE"

      - name: Mark invalid PR body
        if: steps.policy.outputs.enforce == 'true' && steps.validate.outputs.code != '0'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          FINDINGS_FILE: ${{ runner.temp }}/pr-body-check.txt
        with:
          script: |
            const fs = require('node:fs')
            const { pathToFileURL } = require('node:url')
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body-policy.mjs`
            ).href)
            const findings = fs.readFileSync(process.env.FINDINGS_FILE, 'utf8')
            await policy.markInvalidPullRequest({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullRequest: context.payload.pull_request,
              findings,
            })

      - name: Clear invalid PR body state on success
        if: steps.policy.outputs.enforce == 'true' && steps.validate.outputs.code == '0'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const policy = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-body-policy.mjs`
            ).href)
            await policy.clearInvalidPullRequest({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullRequest: context.payload.pull_request,
            })

      - name: Fail when the body is invalid
        if: >-
          always() &&
          steps.policy.outputs.enforce == 'true' &&
          steps.validate.outputs.code != '0'
        run: exit 1
