      - build-android
      - validate
      - verify-daemon-installation
    runs-on: ubuntu-latest
    environment: cloud-nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate.outputs.private-sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-candidate-${{ github.run_id }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-build-${{ github.run_id }}-android
          path: release-assets
      - name: Ensure AWS CLI
        shell: bash
        run: bash .github/scripts/setup-aws-cli.sh
      - name: Verify and publish Android independently
        env:
          LODY_NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
