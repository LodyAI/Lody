        run: node apps/electron/nightly-mobile.mjs publish candidate/candidate.json release-assets
  publish-cli:
    needs:
      - candidate
      - prepare
      - validate
      - verify-daemon-installation
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: cloud-nightly
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      LODY_ENV: production
      LODY_NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate.outputs.private-sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-candidate-${{ github.run_id }}
          path: candidate
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Setup npm trusted publishing
        run: npm install -g npm@11.21.0
      - name: Find immutable npm artifact from an earlier attempt
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: nightly-npm-${{ github.run_id }}
        run: >
          set -euo pipefail

          artifact_id="$(gh api --paginate
          "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" |
            jq -s --arg name "${ARTIFACT_NAME}" '[.[].artifacts[] | select(.name == $name)] | if length == 0 then 0 elif length != 1 or .[0].expired then error("Ambiguous or expired npm artifact") else .[0].id end')"
          echo "id=${artifact_id}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.cached.outputs.id != '0'
        with:
          artifact-ids: ${{ steps.cached.outputs.id }}
          path: nightly-npm
          merge-multiple: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.cached.outputs.id == '0'
        with:
          bun-version: 1.4.4
      - name: Install exact composition dependencies
        if: steps.cached.outputs.id == '0'
        run: corepack pnpm install --frozen-lockfile --prefer-offline
      - name: Build and freeze the nightly npm package
        if: steps.cached.outputs.id == '0'
        run: >
          set -euo pipefail

          for name in LODY_AUTH_URL LODY_AUTH_SITE_URL LODY_SERVER_URL SITE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required for the CLI package build"
              exit 1
            fi
          done

          # Standalone npm CLI inlines production URLs; desktop provenance is separate.

          node apps/cli/nightly-npm.mjs prepare candidate/candidate.json

          corepack pnpm --dir apps/cli build

          corepack pnpm --dir apps/cli prepare:publish

          mkdir -p nightly-npm

          corepack pnpm --dir apps/cli/.publish/lody pack --out
          "${GITHUB_WORKSPACE}/nightly-npm/lody-${LODY_NIGHTLY_VERSION}.tgz"

          node apps/cli/nightly-npm.mjs seal candidate/candidate.json
      - name: Preserve immutable npm artifact before publishing
        if: steps.cached.outputs.id == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-npm-${{ github.run_id }}
          path: nightly-npm
          if-no-files-found: error
          retention-days: 30
      - name: Publish lody under the nightly tag
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          node --version
          pnpm --version
          npm --version
          pnpm exec npm --version
          node apps/cli/nightly-npm.mjs publish candidate/candidate.json
  publish-daemon:
    permissions:
      contents: read
      actions: read
    needs:
      - candidate
      - prepare
      - validate
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/publish-daemon-sea.yml
    with:
      source-sha: ${{ needs.candidate.outputs.private-sha }}
      channel: nightly
      version: ${{ needs.prepare.outputs.version }}
      target-environment: cloud-nightly
    secrets: inherit
  tag-release:
    needs:
      - candidate
      - prepare
      - publish
      - publish-android
      - publish-ios
      - publish-cli
      - publish-daemon
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate.outputs.private-sha }}
          persist-credentials: false
          submodules: recursive
      - name: Tag the successfully published source commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
          NIGHTLY_SHA: ${{ needs.candidate.outputs.private-sha }}
        with:
          script: >
            const { tagNightlyRelease } = await
            import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/nightly-release-tag.mjs`);

            const tag = await tagNightlyRelease({
              github,
              ...context.repo,
              version: process.env.NIGHTLY_VERSION,
              sha: process.env.NIGHTLY_SHA,
            });

            core.info(`Published source tagged: ${tag}`);
