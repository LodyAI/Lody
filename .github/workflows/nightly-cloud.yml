          R2_NIGHTLY_PREFIX: ${{ vars.R2_NIGHTLY_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NIGHTLY_ALLOW_BOOTSTRAP: ${{ vars.NIGHTLY_ALLOW_BOOTSTRAP }}
          NIGHTLY_MINIMUM_STABLE_VERSION: ${{ vars.NIGHTLY_MINIMUM_STABLE_VERSION }}
          STABLE_ELECTRON_VERSION_URL: ${{ vars.STABLE_ELECTRON_VERSION_URL }}
          VITE_ELECTRON_UPDATE_URL: ${{ vars.ELECTRON_UPDATE_URL_NIGHTLY }}
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: node apps/electron/nightly-release.mjs publish candidate/candidate.json release-assets
  publish-android:
    needs:
      - candidate
