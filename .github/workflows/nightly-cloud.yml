      - name: Install verification dependencies without lifecycle scripts
        run:
          corepack pnpm --filter '{./apps/electron}...' --fail-if-no-match install --frozen-lockfile --prefer-offline
          --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-candidate-${{ github.run_id }}
