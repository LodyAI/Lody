name: Conversation browser acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.4'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  conversation-e2e:
    name: Conversation browser tests
    # Playwright 1.58.2 supports Ubuntu 24.04, not the 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install conversation browsers
        run: pnpm --filter @lody/components exec playwright install --with-deps chromium webkit

      - name: Run conversation browser tests
        env:
          CI: 'true'
        run: |
          pnpm --filter @lody/components exec playwright test \
            tests/e2e/session-chat-hydration.spec.ts \
            tests/e2e/session-history-header.spec.ts \
            tests/e2e/conversation-scroll-engine.spec.ts \
            --workers=1

      - name: Run WebKit scroll compensation regression
        env:
          CI: 'true'
          LODY_E2E_BROWSER: webkit
        run: |
          pnpm --filter @lody/components exec playwright test \
            tests/e2e/conversation-scroll-engine.spec.ts \
            --grep 'native wheel input keeps reading corrections' \
            --workers=1
