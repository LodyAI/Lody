name: CLI credential store

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cli-credential-store-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: Native store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start a Secret Service session when one is missing
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          if [ -n "${DBUS_SESSION_BUS_PID:-}" ]; then
            echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          fi
          gnome-keyring-daemon --start --components=secrets --daemonize || true

      - name: Write, read, and delete a credential in separate processes
        if: runner.os != 'Linux'
        run: node --experimental-strip-types apps/cli/scripts/cli-credential-keystore-native.mjs

      - name: Write, read, and delete a credential when Secret Service is available
        if: runner.os == 'Linux'
        env:
          CLI_KEYSTORE_ALLOW_UNAVAILABLE: '1'
        run: node --experimental-strip-types apps/cli/scripts/cli-credential-keystore-native.mjs
