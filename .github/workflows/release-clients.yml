      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL || vars.LODY_AUTH_URL }}
      VITE_CONVEX_DEPLOY_URL: ${{ vars.LODY_AUTH_URL }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_SESSION_SHARE_ORIGIN: ${{ vars.VITE_SESSION_SHARE_ORIGIN }}
      VITE_GITHUB_APP_NAME: ${{ vars.VITE_GITHUB_APP_NAME }}
      VITE_ONESIGNAL_APP_ID: ${{ vars.VITE_ONESIGNAL_APP_ID || vars.ONESIGNAL_APP_ID }}
      VITE_ONESIGNAL_SAFARI_WEB_ID: ${{ vars.VITE_ONESIGNAL_SAFARI_WEB_ID || vars.ONESIGNAL_SAFARI_WEB_ID }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || vars.POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY || vars.POSTHOG_KEY }}
      VITE_VIBELOFT_WEB_AUTH_KEY: ${{ vars.VITE_VIBELOFT_WEB_AUTH_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_MOBILE_ANDROID_PREFIX: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          vars.R2_MOBILE_ANDROID_PREFIX_PRODUCTION ||
          vars.R2_MOBILE_ANDROID_PREFIX_STAGING
        }}
      MOBILE_ANDROID_DOWNLOAD_BASE_URL: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          vars.MOBILE_ANDROID_DOWNLOAD_BASE_URL_PRODUCTION ||
          vars.MOBILE_ANDROID_DOWNLOAD_BASE_URL_STAGING
        }}
      MOBILE_VERSION_CODE: ${{ needs.release.outputs.build_number }}
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.checkout_sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
