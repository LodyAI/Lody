      - name: Normalize mobile auth base URL
        shell: bash
        run: |
          set -euo pipefail
          raw_site_url="${VITE_CONVEX_SITE_URL:-${VITE_CONVEX_DEPLOY_URL:-}}"
          if [[ -z "${raw_site_url}" ]]; then
            echo "VITE_CONVEX_SITE_URL=" >> "$GITHUB_ENV"
            exit 0
          fi

          normalized_site_url="${raw_site_url%/}"
          if [[ "${normalized_site_url}" == *".convex.cloud" ]]; then
            normalized_site_url="${normalized_site_url/.convex.cloud/.convex.site}"
          fi

          echo "VITE_CONVEX_SITE_URL=${normalized_site_url}" >> "$GITHUB_ENV"
      - name: Resolve shared Android version code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
        run: |
          set -euo pipefail
          # The checked-out source defines the numbering scheme. Historical
          # recovery predating this helper retains its original workflow counter.
