        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          required_envs=(
            "VITE_SERVER_URL"
            "VITE_CONVEX_SITE_URL"
            "VITE_CONVEX_DEPLOY_URL"
            "VITE_SITE_URL"
            "R2_ACCOUNT_ID"
            "R2_BUCKET"
            "R2_MOBILE_ANDROID_PREFIX"
            "MOBILE_ANDROID_DOWNLOAD_BASE_URL"
            "ANDROID_KEYSTORE_BASE64"
            "ANDROID_KEYSTORE_PASSWORD"
            "ANDROID_KEY_ALIAS"
            "ANDROID_KEY_PASSWORD"
            "MOBILE_VERSION_NAME"
            "MOBILE_VERSION_CODE"
          )
          for key in "${required_envs[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required Android release env: ${key}"
              exit 1
            fi
          done
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/lody-mobile-release.keystore"

          decode_base64_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local output_path="$3"
            local encoded_path="${output_path}.base64"

            printf '%s' "${secret_value}" |
              sed -e 's/\\n//g' -e 's/\\r//g' |
              tr -d '[:space:]' > "${encoded_path}"
            if [[ ! -s "${encoded_path}" ]]; then
              echo "${secret_name} is empty after removing whitespace"
              exit 1
            fi

            if ! openssl base64 -A -d -in "${encoded_path}" -out "${output_path}"; then
              rm -f "${encoded_path}" "${output_path}"
              echo "${secret_name} must contain base64-encoded file contents."
              echo "Regenerate it with: openssl base64 -A -in <file>"
              exit 1
            fi
            rm -f "${encoded_path}"
          }

          decode_base64_secret "ANDROID_KEYSTORE_BASE64" "${ANDROID_KEYSTORE_BASE64}" "${keystore_path}"
          chmod 600 "${keystore_path}"
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "$GITHUB_ENV"
      - name: Sync Android project
        env:
          PUSH_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.PUSH_ANDROID_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: >
          set -euo pipefail

          test -n "${PUSH_ANDROID_GOOGLE_SERVICES_JSON}" || { echo "Missing PUSH_ANDROID_GOOGLE_SERVICES_JSON" >&2; exit
          1; }

          pnpm --filter @lody/mobile-capacitor run configure:push

          pnpm --filter @lody/mobile-capacitor exec vite build --mode "${MOBILE_VITE_MODE}"

          pnpm --filter @lody/mobile-capacitor exec cap sync android
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile-capacitor/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease \
            -PmobileVersionName="${MOBILE_VERSION_NAME}" \
            -PmobileVersionCode="${MOBILE_VERSION_CODE}"
      - name: Collect Android APK
        shell: bash
        run: >
          set -euo pipefail

          mkdir -p mobile-android-release

          apk_path="$(find apps/mobile-capacitor/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n
          1)"

          if [[ -z "${apk_path}" || ! -f "${apk_path}" ]]; then
            echo "No Android APK found"
            exit 1
          fi

          cp "${apk_path}" mobile-android-release/app.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-android-apk
          path: mobile-android-release/app.apk
          if-no-files-found: error
      - name: Ensure AWS CLI
        shell: bash
        run: bash .github/scripts/setup-aws-cli.sh
      - name: Upload Android APK and metadata to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: bash .github/scripts/upload-android-release.sh
      - name: Remove Android signing material
        shell: bash
        run: rm -f "${RUNNER_TEMP}/lody-mobile-release.keystore" "${RUNNER_TEMP}/lody-mobile-release.keystore.base64"
