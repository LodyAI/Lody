          fi

          find apps/electron/dist -type f \
            \( \
              -name "${metadata_pattern}" -o \
              -name '*.blockmap' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.zip' -o \
              -name '*.delta' -o \
              -name 'appcast.xml' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.snap' \
            \) \
            -print0 | while IFS= read -r -d '' file; do
              relative_path="${file#apps/electron/dist/}"
              destination="electron-release-assets/${relative_path}"
              mkdir -p "$(dirname "${destination}")"
              cp "$file" "${destination}"
            done

          if [[ -z "$(ls -A electron-release-assets)" ]]; then
            echo "No electron release assets collected"
            exit 1
          fi
      - name: Upload Electron release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          compression-level: 0
          name: electron-release-assets-${{ matrix.target }}
          path: electron-release-assets/*
          if-no-files-found: error
      - name: Remove macOS notarization key
        env:
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
