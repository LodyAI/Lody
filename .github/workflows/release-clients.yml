        run: rm -f "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
  upload-electron-to-r2:
    needs:
      - release
      - build-electron
      - verify-daemon-installation
    permissions:
      contents: read
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.build-electron.result == 'success' &&
      needs.verify-daemon-installation.result == 'success' &&
          ((
          needs.release.outputs.publish_requested == 'true' &&
          contains(fromJSON(needs.release.outputs.paths_released), 'apps/electron')
        ) ||
        (
          github.event_name == 'push' &&
          needs.release.outputs.target_environment == 'production' &&
          contains(github.event.head_commit.message || '', '[electron-release]')
        )) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    env:
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ELECTRON_UPDATE_PREFIX: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          vars.R2_ELECTRON_UPDATE_PREFIX_PRODUCTION ||
          vars.R2_ELECTRON_UPDATE_PREFIX_STAGING
        }}
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Clear previous Electron upload artifacts
        shell: bash
        run: rm -rf -- electron-release-assets download-aliases
      - name: Download Electron release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: electron-release-assets-*
          path: electron-release-assets
          merge-multiple: true
      - name: Ensure AWS CLI
        run: bash .github/scripts/setup-aws-cli.sh
        shell: bash
      - name: Upload Electron installers and updater metadata to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" || -z "${R2_ELECTRON_UPDATE_PREFIX}" ]]; then
            echo "R2 configuration is incomplete"
            exit 1
          fi

          endpoint_url="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${R2_ELECTRON_UPDATE_PREFIX#/}"
          prefix="${prefix%/}"

          upload_asset() {
            local file="$1"
            local relative_path="${file#electron-release-assets/}"
            local object_key="${relative_path}"
            if [[ -n "${prefix}" ]]; then
              object_key="${prefix}/${relative_path}"
            fi
            # Versioned artifacts never change once published; mutable pointers
            # must revalidate on every request.
            if [[ "$relative_path" =~ [0-9]+\.[0-9]+\.[0-9]+ ]]; then
              cache_control="public, max-age=31536000, immutable"
              existing_file="$(mktemp "${RUNNER_TEMP}/lody-r2-existing.XXXXXX")"
              head_error="$(mktemp "${RUNNER_TEMP}/lody-r2-head.XXXXXX")"
              if aws s3api head-object \
                --bucket "${R2_BUCKET}" \
                --key "${object_key}" \
                --endpoint-url "${endpoint_url}" \
                >/dev/null 2>"${head_error}"; then
                aws s3 cp "s3://${R2_BUCKET}/${object_key}" "${existing_file}" \
                  --endpoint-url "${endpoint_url}" \
                  --no-progress
                if ! cmp -s "$file" "${existing_file}"; then
                  echo "Refusing to overwrite immutable R2 object with different bytes: ${object_key}"
                  rm -f "${existing_file}" "${head_error}"
                  return 1
                fi
                echo "Immutable R2 object already matches, skipping: ${object_key}"
                rm -f "${existing_file}" "${head_error}"
                return 0
              fi
              if ! grep -Eqi '\(404\)|Not Found|NoSuchKey' "${head_error}"; then
                cat "${head_error}" >&2
                rm -f "${existing_file}" "${head_error}"
                return 1
              fi
              rm -f "${existing_file}" "${head_error}"
            else
              cache_control="no-cache"
            fi
            aws s3 cp "$file" "s3://${R2_BUCKET}/${object_key}" \
              --endpoint-url "${endpoint_url}" \
              --no-progress \
              --cache-control "${cache_control}"
          }

          # Each worker has isolated shell state and unique temporary files. Wait
          # for every immutable upload before publishing any mutable feed pointer.
          export -f upload_asset
          export endpoint_url prefix
          # shellcheck disable=SC2016 # The child Bash intentionally expands its own $1.
          find electron-release-assets -type f \
            \( \
              -name '*.blockmap' -o \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.zip' -o \
              -name '*.delta' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.snap' \
            \) \
            -print0 | xargs -0 -r -P 4 -I '{}' bash -euo pipefail -c 'upload_asset "$1"' _ '{}'

          find electron-release-assets -type f \
            \( -name 'next*.yml' -o -name 'latest*.yml' \) \
            -print0 | while IFS= read -r -d '' file; do
              upload_asset "$file"
            done

          find electron-release-assets -type f -name 'appcast.xml' \
            -print0 | while IFS= read -r -d '' file; do
              upload_asset "$file"
            done
      - name: Upload stable download aliases and version metadata to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          endpoint_url="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="${R2_ELECTRON_UPDATE_PREFIX#/}"
          prefix="${prefix%/}"

          # Extract version from whichever metadata YAML is present
          metadata_file=""
          for f in electron-release-assets/latest-mac.yml \
                   electron-release-assets/latest.yml \
                   electron-release-assets/next-mac.yml \
                   electron-release-assets/next.yml; do
            if [[ -f "$f" ]]; then
              metadata_file="$f"
              break
            fi
          done

          if [[ -z "$metadata_file" ]]; then
            echo "No metadata file found – skipping download aliases"
            exit 0
          fi

          version=$(grep '^version:' "$metadata_file" | head -1 | sed 's/^version: *//')
          release_date=$(grep '^releaseDate:' "$metadata_file" | head -1 \
            | sed "s/^releaseDate: *//" | sed "s/^'//" | sed "s/'$//")

          echo "Creating download aliases for v${version} (${release_date})"

          mkdir -p download-aliases

          # Create fixed-name copies by replacing the version segment, and
          # record alias -> versioned filename so the download page can link
          # directly to the immutable versioned objects (the aliases are only
          # a fallback and can be served stale by HTTP caches).
          shopt -s nullglob
          downloads_json=""
          for file in electron-release-assets/Lody-*.{dmg,exe,AppImage,deb,snap}; do
            filename=$(basename "$file")
            alias_name="${filename/Lody-${version}-/Lody-latest-}"
            cp "$file" "download-aliases/${alias_name}"
            if [[ "$alias_name" != "$filename" ]]; then
              if [[ -n "$downloads_json" ]]; then
                downloads_json+=","
              fi
              downloads_json+="\"${alias_name}\":\"${filename}\""
            fi
          done

          # Generate version.json
          files_json="["
          first=true
          for f in download-aliases/Lody-*; do
            fname=$(basename "$f")
            if [[ "$first" == "true" ]]; then
              first=false
            else
              files_json+=","
            fi
            files_json+="\"${fname}\""
          done
          files_json+="]"

          cat > download-aliases/version.json <<VEOF
          {
            "version": "${version}",
            "releaseDate": "${release_date}",
            "files": ${files_json},
            "downloads": {${downloads_json}}
          }
          VEOF

          echo "Download aliases:"
          ls -la download-aliases/

          # Upload aliases and version.json. All of these objects are mutable
          # pointers overwritten on every release, so they must always
          # revalidate (no-cache) instead of relying on heuristic caching.
          for file in download-aliases/*; do
            filename=$(basename "$file")
            if [[ -n "${prefix}" ]]; then
              object_key="${prefix}/${filename}"
            else
              object_key="${filename}"
            fi
            extra_args=()
            if [[ "$filename" == "version.json" ]]; then
              extra_args=(--content-type application/json)
            fi
            aws s3 cp "$file" "s3://${R2_BUCKET}/${object_key}" \
              --endpoint-url "${endpoint_url}" \
              --no-progress \
              --cache-control "no-cache" \
              "${extra_args[@]}"
          done
  build-mobile-android:
    needs:
      - release
      - validate-app-redirects
      - verify-daemon-installation
    permissions:
      contents: read
      actions: read
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.validate-app-redirects.result == 'success' &&
      needs.verify-daemon-installation.result == 'success' &&
          ((github.event_name == 'push' || inputs.component == 'android') &&
        needs.release.outputs.publish_requested == 'true' &&
        contains(fromJSON(needs.release.outputs.paths_released), 'apps/mobile-capacitor')) }}
    runs-on: macos-15
    environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    env:
      LODY_ENV: ${{ needs.release.outputs.target_environment == 'production' && 'production' || 'staging' }}
      MOBILE_VITE_MODE: ${{ needs.release.outputs.target_environment == 'production' && 'prod' || 'staging' }}
