name: Release cloud clients
on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      component:
        description: Recover one untouched platform from reviewed release
        required: true
        type: choice
        options:
          - cli
          - electron
          - android
          - ios
      expected_sha:
        description: Full original stable release commit SHA
        required: true
        type: string
      expected_version:
        description: Exact existing stable version
        required: true
        type: string
      source_run_id:
        description: 'Original release-clients push: validation failed and all publishers skipped'
        required: true
        type: string
permissions:
  contents: read
env:
  NODE_VERSION: 22.23.4
concurrency:
  group: |-
    ${{
      (github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch') &&
      'lody-production-release' ||
      github.ref == 'refs/heads/main' &&
      'lody-staging-release' ||
      format('release-cli-{0}', github.run_id)
    }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      publish_requested: ${{ steps.recovery.outputs.validated == 'true' && 'true' || steps.release.outputs.releases_created }}
      paths_released: ${{ steps.recovery.outputs.paths_released || steps.release.outputs.paths_released }}
      checkout_sha: ${{ steps.recovery.outputs.checkout_sha || github.sha }}
      build_number: ${{ steps.recovery.outputs.build_number || github.run_number }}
      linux_arm64: ${{ github.event_name != 'workflow_dispatch' || steps.recovery.outputs.linux_arm64 == 'true' }}
      target_environment: ${{ (steps.recovery.outputs.validated == 'true' || github.ref_name == 'release') && 'production' || 'staging' }}
    steps:
      - name: Checkout reviewed recovery helper
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Validate recovery before production environments
        if: github.event_name == 'workflow_dispatch'
        id: recovery
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RECOVERY_INPUTS: ${{ toJSON(inputs) }}
          WORKFLOW_SHA: ${{ github.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const helper = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/stable-release-recovery.mjs`);
            const { validateRecovery } = await import(helper.href);
            const target = await validateRecovery({ github, context,
              inputs: JSON.parse(process.env.RECOVERY_INPUTS), currentSha: process.env.WORKFLOW_SHA });
            for (const [name, value] of Object.entries(target)) core.setOutput(name, value);
            if (JSON.parse(process.env.RECOVERY_INPUTS).component === 'electron') {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: 'apps/electron/package.json', ref: target.checkout_sha,
              });
              const pkg = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              core.setOutput('linux_arm64', Boolean(pkg.scripts?.['build:linux:arm64']));
            }
            core.setOutput('validated', 'true');
      - name: Resolve release-please files
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF_NAME}" == "release" ]]; then
            echo "RELEASE_PLEASE_CONFIG=release-please-config.json" >> "$GITHUB_ENV"
            echo "RELEASE_PLEASE_MANIFEST=.release-please-manifest.json" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PLEASE_CONFIG=release-please-config.prerelease.json" >> "$GITHUB_ENV"
            echo "RELEASE_PLEASE_MANIFEST=.release-please-manifest.prerelease.json" >> "$GITHUB_ENV"
          fi
      - name: Release Please
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: ${{ env.RELEASE_PLEASE_CONFIG }}
          manifest-file: ${{ env.RELEASE_PLEASE_MANIFEST }}
          target-branch: ${{ github.ref_name }}
    if:
      github.repository == 'LodyAI/Lody' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release') &&
      vars.CLIENT_RELEASES_ENABLED == 'true'
  validate-app-redirects:
    needs: release
    permissions:
      contents: read
    if: ${{ needs.release.outputs.publish_requested == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
      LODY_SKIP_ELECTRON_POSTINSTALL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.checkout_sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install validation dependencies
        run: corepack pnpm install --frozen-lockfile --prefer-offline
        env:
          LODY_SKIP_ELECTRON_POSTINSTALL: '1'
      - name: Run independent validation
        env:
          CHECK: ${{ matrix.check }}
          GOMAXPROCS: '2'
          GOMEMLIMIT: 3GiB
        shell: bash
        run: >
          set -euo pipefail

          case "$CHECK" in
            lint) corepack pnpm check:quick ;;
            typecheck-desktop-cli)
              corepack pnpm --dir apps/cli prepare:acp-adapters
              corepack pnpm -r --no-sort --workspace-concurrency=2 --filter '!{**/acp-extension-*}' --filter '!./apps/mobile-capacitor' run typecheck
              ;;
            typecheck-mobile) corepack pnpm --dir apps/mobile-capacitor typecheck ;;
            *) exit 1 ;;
          esac
    strategy:
      fail-fast: false
      matrix:
        check:
          - lint
          - typecheck-desktop-cli
          - typecheck-mobile
    name: validate-app-redirects (${{ matrix.check }})
  publish-daemon:
    permissions:
      contents: read
      actions: read
    needs:
      - release
      - validate-app-redirects
    if:
      ${{ needs.release.outputs.publish_requested == 'true' && (contains(fromJSON(needs.release.outputs.paths_released),
      'apps/cli') || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/publish-daemon-sea.yml
    with:
      source-sha: ${{ needs.release.outputs.checkout_sha }}
      channel: ${{ needs.release.outputs.target_environment == 'production' && 'stable' || 'next' }}
      target-environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    secrets: inherit
  verify-daemon-installation:
    needs:
      - release
      - publish-daemon
    if: |-
      ${{ !cancelled() && needs.release.result == 'success' &&
          (needs.publish-daemon.result == 'success' || needs.publish-daemon.result == 'skipped') &&
          (needs.release.outputs.publish_requested == 'true' ||
           (github.event_name == 'push' && needs.release.outputs.target_environment == 'production' &&
            contains(github.event.head_commit.message || '', '[electron-release]'))) }}
    runs-on: ubuntu-latest
    environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.checkout_sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .daemon-publish-gate
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Verify public installers and all platform downloads before client publication
        env:
          DAEMON_CHANNEL: ${{ needs.release.outputs.target_environment == 'production' && 'stable' || 'next' }}
          DAEMON_EXPECTED_VERSION: auto
        run: node .daemon-publish-gate/apps/cli/check-installer.mjs . "$DAEMON_CHANNEL" "$DAEMON_EXPECTED_VERSION"
  publish-cli:
    needs:
      - release
      - validate-app-redirects
      - verify-daemon-installation
    permissions:
      contents: read
      id-token: write
    if: |-
      ${{ needs.verify-daemon-installation.result == 'success' &&
        (
          needs.release.outputs.publish_requested == 'true' &&
          contains(fromJSON(needs.release.outputs.paths_released), 'apps/cli')
        )
      }}
    runs-on: ubuntu-latest
    environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    env:
      LODY_ENV: ${{ needs.release.outputs.target_environment == 'production' && 'production' || 'staging' }}
      NPM_DIST_TAG: ${{ needs.release.outputs.target_environment == 'production' && 'latest' || 'next' }}
      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.checkout_sha }}
          submodules: recursive
      - name: Validate CLI release env
        shell: bash
        run: |
          set -euo pipefail
          for name in LODY_AUTH_URL LODY_AUTH_SITE_URL LODY_SERVER_URL SITE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required for the CLI package build"
              exit 1
            fi
          done
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --prefer-offline
      - name: Build CLI package
        run: corepack pnpm --dir apps/cli build
      - name: Stage immutable npm packages
        run: corepack pnpm --dir apps/cli prepare:publish
      - name: Publish lody to npm
        working-directory: apps/cli/.publish/lody
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          node --version
          pnpm --version
          npm --version
          pnpm exec npm --version
          pnpm publish --access public --no-git-checks --tag "${NPM_DIST_TAG}"
  build-electron:
    needs:
      - release
      - validate-app-redirects
    permissions:
      contents: read
    if: |-
      ${{
        (
          needs.release.outputs.publish_requested == 'true' &&
          contains(fromJSON(needs.release.outputs.paths_released), 'apps/electron')
        ) ||
        (
          github.event_name == 'push' &&
          needs.release.outputs.target_environment == 'production' &&
          contains(github.event.head_commit.message || '', '[electron-release]')
        )
      }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            needs.release.outputs.target_environment == 'production' && needs.release.outputs.linux_arm64 != 'true' &&
            '{"include":[{"os":"macos-15","target":"mac","build_script":"build:mac:release"},{"os":"windows-2022","target":"win","build_script":"build:win:release"},{"os":"ubuntu-latest","target":"linux","build_script":"build:linux:release"}]}' ||
            needs.release.outputs.target_environment == 'production' &&
            '{"include":[{"os":"macos-15","target":"mac","build_script":"build:mac:release"},{"os":"windows-2022","target":"win","build_script":"build:win:release"},{"os":"ubuntu-latest","target":"linux","build_script":"build:linux:release"},{"os":"ubuntu-24.04-arm","target":"linux-arm64","build_script":"build:linux:arm64:release"}]}' ||
            '{"include":[{"os":"macos-15","target":"mac","build_script":"build:mac:staging"}]}'
          )
        }}
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.release.outputs.target_environment == 'production' && 'cloud-production' || 'cloud-staging' }}
    env:
      LODY_ENV: ${{ needs.release.outputs.target_environment == 'production' && 'production' || 'staging' }}
      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      VITE_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      VITE_CONVEX_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL || vars.LODY_AUTH_URL }}
      VITE_CONVEX_DEPLOY_URL: ${{ vars.LODY_AUTH_URL }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_SESSION_SHARE_ORIGIN: ${{ vars.VITE_SESSION_SHARE_ORIGIN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST || vars.POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY || vars.POSTHOG_KEY }}
      VITE_LODY_ENV: ${{ needs.release.outputs.target_environment == 'production' && 'production' || 'staging' }}
      VITE_ELECTRON_UPDATE_URL: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          vars.ELECTRON_UPDATE_URL_PRODUCTION ||
          vars.ELECTRON_UPDATE_URL_STAGING
        }}
      VITE_ELECTRON_UPDATE_CHANNEL: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          'latest' ||
          'next'
        }}
      ELECTRON_UPDATE_CHANNEL: |-
        ${{
          needs.release.outputs.target_environment == 'production' &&
          'latest' ||
          'next'
        }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_msvs_version: ${{ matrix.target == 'win' && '2022' || '' }}
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.checkout_sha }}
          submodules: recursive
      - name: Normalize Electron auth base URL
        shell: bash
        run: |
          set -euo pipefail
          raw_site_url="${VITE_CONVEX_SITE_URL:-${VITE_CONVEX_DEPLOY_URL:-}}"
          if [[ -z "${raw_site_url}" ]]; then
            echo "VITE_CONVEX_SITE_URL=" >> "$GITHUB_ENV"
            exit 0
          fi

          normalized_site_url="${raw_site_url%/}"
          if [[ "${normalized_site_url}" == *".convex.cloud" ]]; then
            normalized_site_url="${normalized_site_url/.convex.cloud/.convex.site}"
          fi

          echo "VITE_CONVEX_SITE_URL=${normalized_site_url}" >> "$GITHUB_ENV"

          update_base_url="${VITE_ELECTRON_UPDATE_URL%/}"
          {
            echo "SPARKLE_APPCAST_URL=${update_base_url}/appcast.xml"
            echo "SPARKLE_DOWNLOAD_URL_PREFIX=${update_base_url}/"
            echo "SPARKLE_APPCAST_URL_ARM64=${update_base_url}/arm64/appcast.xml"
            echo "SPARKLE_DOWNLOAD_URL_PREFIX_ARM64=${update_base_url}/arm64/"
            echo "SPARKLE_APPCAST_URL_X64=${update_base_url}/x64/appcast.xml"
            echo "SPARKLE_DOWNLOAD_URL_PREFIX_X64=${update_base_url}/x64/"
          } >> "$GITHUB_ENV"
      - name: Validate Electron build env
        shell: bash
        run: |
          set -euo pipefail
          required_envs=(
            "VITE_SERVER_URL"
            "VITE_CONVEX_SITE_URL"
            "VITE_CONVEX_DEPLOY_URL"
            "VITE_SITE_URL"
            "VITE_PUBLIC_POSTHOG_HOST"
            "VITE_PUBLIC_POSTHOG_KEY"
            "VITE_ELECTRON_UPDATE_URL"
          )
          for key in "${required_envs[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required env: ${key}"
              exit 1
            fi
          done
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare macOS signing and notarization credentials
        if: matrix.target == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ matrix.target == 'mac' && secrets.SPARKLE_ED_PUBLIC_KEY || '' }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required_envs=(
            "CSC_LINK"
            "CSC_KEY_PASSWORD"
            "APPLE_API_KEY_P8"
            "APPLE_API_KEY_ID"
            "APPLE_API_ISSUER"
            "SPARKLE_ED_PUBLIC_KEY"
            "SPARKLE_ED_PRIVATE_KEY"
          )
          for key in "${required_envs[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required macOS signing or Sparkle secret: ${key}"
              exit 1
            fi
          done

          api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${api_key_path}"
          chmod 600 "${api_key_path}"
          echo "APPLE_API_KEY=${api_key_path}" >> "$GITHUB_ENV"
      - name: Remove previous macOS packaging outputs
        if: matrix.target == 'mac'
        run: rm -rf -- apps/electron/dist
      - name: Validate Sparkle signing key pair before building
        if: matrix.target == 'mac'
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: node apps/electron/sparkle-signing.mjs key-pair
      - name: Build Electron package (${{ matrix.target }})
        env:
          CSC_NAME: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_NAME || '' }}
          CSC_LINK: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.target == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          SPARKLE_ED_PUBLIC_KEY: ${{ matrix.target == 'mac' && secrets.SPARKLE_ED_PUBLIC_KEY || '' }}
          BUILD_SCRIPT: ${{ matrix.build_script }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash .github/scripts/observe-macos-build.sh corepack pnpm --dir apps/electron run "$BUILD_SCRIPT"
          else
            corepack pnpm --dir apps/electron run "$BUILD_SCRIPT"
          fi
      - name: Generate signed Sparkle appcast and deltas (staging)
        if: matrix.target == 'mac' && needs.release.outputs.target_environment != 'production'
        uses: ./.github/actions/generate-sparkle-appcast
        with:
          legacy-appcast-sha256: 6f23204c249f4c7ef5dc599a0ff2b6053dac43246b35ed0f3a1e3d972b1377d7
          delta-compression: lzfse
          appcast-url: ${{ env.SPARKLE_APPCAST_URL }}
          archive-dir: ${{ runner.temp }}/sparkle-appcast
          dist-dir: apps/electron/dist
          download-url-prefix: ${{ env.SPARKLE_DOWNLOAD_URL_PREFIX }}
          public-key: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          private-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          allow-missing-appcast: ${{ vars.SPARKLE_ALLOW_MISSING_APPCAST || 'false' }}
      - name: Generate signed Sparkle appcast and deltas (arm64)
        if: matrix.target == 'mac' && needs.release.outputs.target_environment == 'production'
        uses: ./.github/actions/generate-sparkle-appcast
        with:
          delta-compression: lzfse
          appcast-url: ${{ env.SPARKLE_APPCAST_URL_ARM64 }}
          archive-dir: ${{ runner.temp }}/sparkle-appcast-arm64
          dist-dir: apps/electron/dist
          archive-pattern: '*-arm64.zip'
          output-dir: apps/electron/dist/arm64
          download-url-prefix: ${{ env.SPARKLE_DOWNLOAD_URL_PREFIX_ARM64 }}
          public-key: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          private-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          allow-missing-appcast: ${{ vars.SPARKLE_ALLOW_MISSING_APPCAST || 'false' }}
      - name: Generate signed Sparkle appcast and deltas (x64)
        if: matrix.target == 'mac' && needs.release.outputs.target_environment == 'production'
        uses: ./.github/actions/generate-sparkle-appcast
        with:
          delta-compression: lzfse
          appcast-url: ${{ env.SPARKLE_APPCAST_URL_X64 }}
          archive-dir: ${{ runner.temp }}/sparkle-appcast-x64
          dist-dir: apps/electron/dist
          archive-pattern: '*-x64.zip'
          output-dir: apps/electron/dist/x64
          download-url-prefix: ${{ env.SPARKLE_DOWNLOAD_URL_PREFIX_X64 }}
          public-key: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          private-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          allow-missing-appcast: ${{ vars.SPARKLE_ALLOW_MISSING_APPCAST || 'false' }}
      - name: Prepare channel metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ELECTRON_UPDATE_CHANNEL}" != "next" ]]; then
            exit 0
          fi

          shopt -s nullglob
          next_metadata_files=(apps/electron/dist/next*.yml)
          if [[ ${#next_metadata_files[@]} -gt 0 ]]; then
            exit 0
          fi

          latest_metadata_files=(apps/electron/dist/latest*.yml)
          if [[ ${#latest_metadata_files[@]} -eq 0 ]]; then
            echo "No next*.yml or latest*.yml metadata generated by electron-builder"
            exit 1
          fi

          for file in "${latest_metadata_files[@]}"; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            cp "$file" "${dir}/${base/latest/next}"
          done
      - name: Collect Electron release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p electron-release-assets
          metadata_pattern='latest*.yml'
          if [[ "${ELECTRON_UPDATE_CHANNEL}" == "next" ]]; then
