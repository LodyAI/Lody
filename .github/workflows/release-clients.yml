            node .github/scripts/android-version-code.mjs
          fi
      - name: Resolve mobile version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile-capacitor/package.json').version")"
          if [[ -z "${version}" ]]; then
            echo "Could not resolve mobile package version"
            exit 1
          fi
          echo "MOBILE_VERSION_NAME=${version}" >> "$GITHUB_ENV"
          echo "MOBILE_BUILD_NUMBER=${MOBILE_VERSION_CODE}" >> "$GITHUB_ENV"
