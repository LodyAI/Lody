name: Publish managed daemon SEA
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      channel:
        required: true
        type: string
      version:
        default: ''
        type: string
      target-environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      expected_version:
        required: true
        type: string
      source_run_id:
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group:
    ${{ inputs.source-sha == '' && (github.ref == 'refs/heads/release' && 'lody-production-release' ||
    'lody-staging-release') || format('lody-daemon-sea-{0}', inputs.channel) }}
  cancel-in-progress: false
jobs:
  validate-target:
    if: github.event_name == 'workflow_dispatch' && inputs.source-sha == '' && vars.CLIENT_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      checkout_sha: ${{ steps.target.outputs.checkout_sha }}
      build_number: ${{ steps.target.outputs.build_number }}
      target_environment: ${{ steps.target.outputs.target_environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: target
        env:
          TARGET_INPUTS: ${{ toJSON(inputs) }}
          COMPONENT: daemon
        with:
          script: >
            const { validateManualTarget } = await
            import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/client-release-target.mjs`);

            const target = await validateManualTarget({github, context, inputs: JSON.parse(process.env.TARGET_INPUTS),
            component: process.env.COMPONENT});

            for (const [key, value] of Object.entries(target)) core.setOutput(key, value);
  build:
    name: SEA build ${{ matrix.platform }}
    environment: ${{ inputs.target-environment || needs.validate-target.outputs.target_environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-15-intel
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: win32-x64
            os: windows-2022
          - platform: win32-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      LODY_ENV:
        ${{ (inputs.target-environment || needs.validate-target.outputs.target_environment) == 'cloud-production' &&
        'production' || (inputs.channel == 'nightly' && 'production' || 'staging') }}
      LODY_AUTH_URL: ${{ vars.LODY_AUTH_URL }}
      LODY_AUTH_SITE_URL: ${{ vars.LODY_AUTH_SITE_URL }}
      LODY_SERVER_URL: ${{ vars.LODY_SERVER_URL || vars.SERVER_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      LODY_NIGHTLY_VERSION: ${{ inputs.version }}
      LODY_DAEMON_CHANNEL: ${{ inputs.channel || (github.ref_name == 'release' && 'stable' || 'next') }}
      NODE_OPTIONS: --max-old-space-size=4096
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha || needs.validate-target.outputs.checkout_sha }}
          persist-credentials: false
          submodules: recursive
      - name: Validate admitted source and channel
        env:
          EXPECTED_SHA: ${{ inputs.source-sha || needs.validate-target.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          case "$LODY_DAEMON_CHANNEL" in stable|next|nightly) ;; *) exit 1 ;; esac
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
          cache: pnpm
      - name: Find frozen same-run platform artifact
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: daemon-sea-${{ github.run_id }}-${{ matrix.platform }}
          DAEMON_BUILD_JOB_NAME: SEA build ${{ matrix.platform }}
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/daemon-artifacts-${{ matrix.platform }}.json"
          jobs="$RUNNER_TEMP/daemon-jobs-${{ matrix.platform }}.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" |
            jq -s '[.[].artifacts[]]' > "$artifacts"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" |
            jq -s '[.[].jobs[]]' > "$jobs"
          node apps/cli/sea-retry.mjs "$artifacts" "$jobs" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.cached.outputs.id != '0'
        with:
          artifact-ids: ${{ steps.cached.outputs.id }}
          path: daemon-sea-work/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.cached.outputs.id == '0' && inputs.channel == 'nightly'
        with:
          name: nightly-candidate-${{ github.run_id }}
          path: candidate
      - name: Select shared nightly version
        if: steps.cached.outputs.id == '0' && inputs.channel == 'nightly'
        run: node apps/cli/nightly-npm.mjs prepare candidate/candidate.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.cached.outputs.id == '0'
        with:
          bun-version: 1.4.4
      - name: Build exact cloud composition and stage complete runtime closure
        if: steps.cached.outputs.id == '0'
        run: |
          set -euo pipefail
          corepack pnpm --filter lody... install --frozen-lockfile --prefer-offline
          corepack pnpm --dir apps/cli build
          node apps/cli/sea-release.mjs stage
      - name: Sign native code, build SEA, notarize and freeze checksummed release
        if: steps.cached.outputs.id == '0'
        env:
          CSC_NAME: ${{ (startsWith(matrix.platform, 'darwin-')) && secrets.MACOS_CERTIFICATE_NAME || '' }}
          MACOS_CERTIFICATE_P12_BASE64:
            ${{ (matrix.platform == 'darwin-arm64' || matrix.platform == 'darwin-x64') &&
            secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'darwin-') && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.platform, 'darwin-') && secrets.APPLE_API_ISSUER || '' }}
          WINDOWS_CERTIFICATE_P12_BASE64: ${{ startsWith(matrix.platform, 'win32-') && secrets.WINDOWS_CERTIFICATE_P12_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'win32-') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: node apps/cli/sea-release.mjs package
      - name: Verify standalone installer with frozen native bytes
        run: node apps/cli/install-native-acceptance.mjs daemon-sea-work/release
      - name: Freeze signed platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.cached.outputs.id == '0'
        with:
          name: daemon-sea-${{ github.run_id }}-${{ matrix.platform }}
          path: daemon-sea-work/release
          if-no-files-found: error
          retention-days: 30
    needs: validate-target
    if:
      ${{ !cancelled() && ((inputs.source-sha != '' && github.repository == 'LodyAI/Lody' && inputs.source-sha ==
      github.sha && ((inputs.channel == 'nightly' && github.ref == 'refs/heads/main' && inputs.target-environment ==
      'cloud-nightly') || (inputs.channel == 'next' && github.ref == 'refs/heads/main' && inputs.target-environment ==
      'cloud-staging') || (inputs.channel == 'stable' && github.ref == 'refs/heads/release' && inputs.target-environment
      == 'cloud-production')) && vars.CLIENT_RELEASES_ENABLED == 'true') || needs.validate-target.result == 'success')
      }}
  publish:
    needs:
      - build
      - validate-target
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-environment || needs.validate-target.outputs.target_environment }}
    env:
      LODY_NIGHTLY_VERSION: ${{ inputs.version }}
      LODY_DAEMON_CHANNEL: ${{ inputs.channel || (github.ref_name == 'release' && 'stable' || 'next') }}
      LODY_DAEMON_SOURCE_SHA: ${{ inputs.source-sha || needs.validate-target.outputs.checkout_sha }}
      LODY_PLATFORM: cloud
      VITE_LODY_PLATFORM: cloud
      LODY_ENV:
        ${{ (inputs.target-environment || needs.validate-target.outputs.target_environment) == 'cloud-production' &&
        'production' || (inputs.channel == 'nightly' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha || needs.validate-target.outputs.checkout_sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: daemon-sea-${{ github.run_id }}-*
          path: daemon-sea-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.channel == 'nightly'
        with:
          name: nightly-candidate-${{ github.run_id }}
          path: candidate
      - name: Select shared nightly version
        if: inputs.channel == 'nightly'
        run: node apps/cli/nightly-npm.mjs prepare candidate/candidate.json
      - name: Collect exact platform artifacts
        run: >
          node --input-type=module <<'JS'

          import fs from 'node:fs';

          import { platforms } from './apps/cli/sea-publish.mjs';

          fs.mkdirSync('daemon-release');

          for (const platform of platforms)
          fs.cpSync(`daemon-sea-artifacts/daemon-sea-${process.env.GITHUB_RUN_ID}-${platform}`,
          `daemon-release/${platform}`, { recursive: true });

          const {version} = JSON.parse(fs.readFileSync('apps/cli/package.json'));

          fs.appendFileSync(process.env.GITHUB_ENV, `LODY_DAEMON_VERSION=${version}\n`);

          JS
      - name: Ensure AWS CLI is available without publication credentials
        run: bash .github/scripts/setup-aws-cli.sh
        shell: bash
      - name: Upload immutable release, then conditionally advance channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_RUNTIME_BUCKET: ${{ vars.R2_RUNTIME_BUCKET }}
        run: node apps/cli/sea-publish.mjs daemon-release
      - name: Verify public SEA installer availability
        run: node apps/cli/check-installer.mjs . "$LODY_DAEMON_CHANNEL" "$LODY_DAEMON_VERSION"
    if: ${{ !cancelled() && needs.build.result == 'success' }}
