name: Desktop E2E PR failure

on:
  workflow_run:
    workflows: [Desktop E2E PR]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: desktop-e2e-pr-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report PR failure evidence
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted reporting code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve current pull request
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const associated = context.payload.workflow_run.pull_requests ?? []
            if (associated.length !== 1) {
              core.warning(`Expected one associated pull request, found ${associated.length}.`)
              core.setOutput('report', 'false')
              return
            }
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: associated[0].number
            })
            if (pull.data.state !== 'open') {
              core.notice(`Pull request #${pull.data.number} is no longer open.`)
              core.setOutput('report', 'false')
              return
            }
            if (pull.data.head.sha !== context.payload.workflow_run.head_sha) {
              core.notice(`Skipping stale failure from ${context.payload.workflow_run.head_sha}.`)
              core.setOutput('report', 'false')
              return
            }
            core.setOutput('number', String(pull.data.number))
            core.setOutput('report', 'true')

      - name: Find PR evidence
        if: steps.target.outputs.report == 'true'
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const policy = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-daily-policy.mjs`
            )
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100
            })
            const evidence = policy.findPrEvidenceArtifact(
              artifacts,
              context.payload.workflow_run.id
            )
            core.setOutput('available', String(Boolean(evidence)))
            core.setOutput('suite', evidence?.suite ?? 'unknown')
            core.setOutput('artifact-name', evidence?.artifact.name ?? '')
            if (!evidence) core.warning('No unique, unexpired PR evidence artifact is available.')

      - name: Download PR evidence
        if: steps.target.outputs.report == 'true' && steps.evidence.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact-name }}
          path: pr-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare bounded failure comments
        if: steps.target.outputs.report == 'true'
        id: report
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SUITE: ${{ steps.evidence.outputs.suite }}
        run: |
          mkdir -p pr-evidence pr-report
          manifest=$(node .github/scripts/e2e-daily-failure.mjs \
            --evidence-root pr-evidence \
            --output-root pr-report \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --head-sha "$HEAD_SHA" \
            --channel pr \
            --suite "$SUITE")
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Install GitHub CLI attachment support
        if: steps.target.outputs.report == 'true'
        id: gh
        shell: bash
        env:
          GH_ARCHIVE_SHA256: e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be
          GH_VERSION: 2.100.0
        run: |
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh"
          "$binary" pr comment --help | grep --fixed-strings --quiet -- '--attach'
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Attach all failed scenario videos
        if: steps.target.outputs.report == 'true'
        shell: bash
        env:
          GH_ATTACH_BIN: ${{ steps.gh.outputs.binary }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ steps.report.outputs.manifest }}
          PR_NUMBER: ${{ steps.target.outputs.number }}
        run: |
          comments="$RUNNER_TEMP/pr-failure-comments.json"
          "$GH_ATTACH_BIN" api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$comments"
          batch_count=$(jq '.batches | length' "$MANIFEST")
          for ((index = 0; index < batch_count; index += 1)); do
            marker=$(jq -r --argjson index "$index" '.batches[$index].marker' "$MANIFEST")
            expected_videos=$(
              jq --argjson index "$index" '.batches[$index].videos | length' "$MANIFEST"
            )
            complete=$(
              node .github/scripts/e2e-daily-policy.mjs comment-complete \
                --comments "$comments" \
                --marker "$marker" \
                --expected "$expected_videos"
            )
            if [[ "$complete" == 'true' ]]; then
              echo "Skipping previously attached batch: $marker"
              continue
            fi
            body_path=$(jq -r --argjson index "$index" '.batches[$index].bodyPath' "$MANIFEST")
            mapfile -t videos < <(
              jq -r --argjson index "$index" '.batches[$index].videos[]' "$MANIFEST"
            )
            attachment_args=()
            for video in "${videos[@]}"; do
              attachment_args+=(--attach "$video")
            done
            "$GH_ATTACH_BIN" pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_path" \
              "${attachment_args[@]}"
          done
